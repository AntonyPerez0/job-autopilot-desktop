<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ap-file:; frame-src ap-file:">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Set up Job Autopilot: connect an AI, add your resume, and choose the jobs to look for.">
<title>Job Autopilot setup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="icons.js"></script>
<script>document.documentElement.dataset.platform = (window.ja && window.ja.platform) || "";</script>
<div class="app-top" aria-hidden="true"></div>
<div class="wiz">
  <aside class="wiz-side">
    <div class="brand"><div class="logo"><svg class="i" aria-hidden="true"><use href="#i-bolt"/></svg></div>Job Autopilot</div>
    <div id="steps"></div>
  </aside>
  <main class="wiz-main">
    <div id="step"></div>
    <div id="err" style="margin-top:16px" role="alert"></div>
    <div class="wiz-foot"><button class="btn" id="back">Back</button><div class="right"><button class="btn ghost" id="skip" hidden>Skip</button><button class="btn primary" id="next">Continue</button></div></div>
  </main>
</div>
<script src="forms.js"></script>
<script>
const { esc, icon, msg } = Forms;
const STEPS = [
  { id: "welcome", label: "Welcome" },
  { id: "ai", label: "Connect AI", title: "Connect an AI model", lead: "Job Autopilot needs an AI model: one you pay for directly with your own key (about a cent or less per application with the default), or a free one running on this computer with Ollama or LM Studio." },
  { id: "resumes", label: "Your resume", title: "Your resume", lead: "Upload the resume you have, and the app splits it into pieces you approve next. No resume? Make one here in a couple of minutes." },
  { id: "review", label: "Check it", title: "Approve every piece", lead: "Resumes are only ever assembled from what you approve here, so nothing reaches an employer that you did not write and check." },
  { id: "questions", label: "About you", title: "About you", lead: "Application forms ask these every time. The app always uses your answers here, and corrects the AI if it ever says something different." },
  { id: "prefs", label: "Jobs to look for", title: "What jobs to look for", lead: "Pick job titles, where you want to work, and where the app should look. It checks every job it finds for fit before applying." },
  { id: "mail", label: "Mailbox", title: "Connect your mailbox (optional)", lead: "For employers that email a security code, and to spot jobs you already applied to." , optional: true },
  { id: "start", label: "Start" },
];
let i = 0, cfg = null, form = null;

function drawSteps() {
  document.getElementById("steps").innerHTML = STEPS.map((s, k) => `<div class="wiz-step ${k === i ? "on" : k < i ? "done" : ""}" data-k="${k}"><span class="n">${k < i ? "&#10003;" : k + 1}</span>${s.label}</div>`).join("");
  document.querySelectorAll(".wiz-step").forEach((e) => e.onclick = () => { const k = Number(e.dataset.k); if (k < i) show(k); });
}

function show(k) {
  i = k; form = null;
  msg(document.getElementById("err"), "", "");
  const s = STEPS[i];
  const el = document.getElementById("step");
  document.getElementById("back").style.visibility = i ? "visible" : "hidden";
  document.getElementById("skip").hidden = !s.optional;
  document.getElementById("next").textContent = i === STEPS.length - 1 ? "Start in dry run" : i === 0 ? "Get started" : "Continue";
  drawSteps();
  if (s.id === "welcome") {
    el.innerHTML = `<h1>Apply to jobs while you do something else</h1>
      <p class="lead">Job Autopilot finds jobs that match what you want, writes a one-page resume for each from pieces you approved, fills in the application in a browser window you can watch, and submits it. It keeps a full record of every application.</p>
      <div class="card sec"><h2>What kind of work are you looking for?</h2>
        <div class="kind-cards">${[["hourly", "Hourly and everyday jobs", "Retail, food, warehouse, driving, healthcare support, customer service"],
          ["office", "Office, tech and professional jobs", "Software, data, admin, finance, marketing, design"],
          ["both", "Both", "Show me everything that fits"]].map(([v, t, d]) => `<label class="jobkind ${(cfg.prefs.jobKind || "both") === v ? "on" : ""}"><input type="radio" name="kind" value="${v}" ${(cfg.prefs.jobKind || "both") === v ? "checked" : ""}><b>${t}</b><small>${d}</small></label>`).join("")}</div></div>
      <div class="card sec"><h2>What it will and won’t do</h2><ul class="bul" style="margin-top:12px">
        <li>It never submits with a required question unanswered, and never guesses legal agreements. Those jobs wait for you.</li>
        <li>It only states facts from your approved resume and your answers. A second AI pass fact-checks every written answer, and answers that fail are not used.</li>
        <li>It starts in <b>dry run</b>: forms are filled but never submitted until you have checked one and switched to live.</li>
        <li>It applies at a steady pace (10 a day by default) and never to the same job twice.</li>
        <li>It does not solve CAPTCHAs. It makes accounts on job sites only if you turn that on in Settings (Workday, with your email and password); otherwise jobs that need an account are left for you.</li>
        <li>Everything stays on this computer, except what is sent to your AI provider and to the job sites themselves.</li></ul></div>
      <div class="card sec"><h2>Before you start</h2>
        <p style="margin:8px 0 12px">Automated applications may go against the terms of some job sites or employers, and some employers may treat them differently. You are responsible for every application sent in your name; review the dry-run results before you go live.</p>
        <label class="check"><input type="checkbox" id="terms" ${cfg.settings.acceptedTerms ? "checked" : ""}>I understand, and I will check the applications it sends.</label></div>
      <div id="history-found"></div>`;
    offerHistory();
    document.querySelectorAll("[name=kind]").forEach((r) => r.onchange = () => document.querySelectorAll(".jobkind").forEach((k) => k.classList.toggle("on", k.querySelector("input").checked)));
    return;
  }
  if (s.id === "start") {
    el.innerHTML = `<h1>Ready for a dry run</h1>
      <p class="lead">The app will search for jobs, screen them, and fill in the first good match without submitting it. Then it stops and waits for you.</p>
      <div class="card sec"><h2>What happens next</h2><ol class="bul" style="margin-top:12px">
        <li>A browser window opens and you can watch it fill in the form. Leave the app open; closing it stops the autopilot.</li>
        <li>The filled application shows up on the Overview with every answer, the resume it would send, and screenshots.</li>
        <li>Check it and press <b>I checked these answers</b>. Fix anything wrong in Settings.</li>
        <li>When you trust it, turn on <b>Go live</b> in the sidebar. You can pause or go back to dry run at any time.</li></ol></div>`;
    return;
  }
  el.innerHTML = `<h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="card sec" id="sec"></div>`;
  const sec = document.getElementById("sec");
  if (s.id === "ai") form = Forms.ai(sec, cfg);
  if (s.id === "resumes") form = Forms.resumes(sec, cfg, () => setTimeout(() => show(i + 1), 600));
  if (s.id === "review") {
    form = Forms.review(sec, cfg);
    // A short resume: the questions that fill the page, before the person approves anything.
    const exp = (cfg.profile && cfg.profile.experience) || [];
    const lines = exp.reduce((n, e) => n + (e.bullets || []).length, 0);
    if (exp.length <= 2 || lines < 12) {
      const fold = document.createElement("details");
      fold.className = "more"; fold.style.marginBottom = "12px";
      fold.innerHTML = `<summary><b>Want a fuller page?</b><span>Optional: a few questions about other work, licenses, records and school that people usually leave out</span></summary><div data-fill style="padding:4px 16px 16px"></div>`;
      sec.parentNode.insertBefore(fold, sec);
      let opened = false;
      fold.ontoggle = async () => {
        if (!fold.open || opened) return;
        opened = true;
        await form.save(); // keep what they ticked so far
        Forms.fillPage(fold.querySelector("[data-fill]"), cfg, () => { form = Forms.review(sec, cfg); });
      };
    }
  }
  if (s.id === "questions") form = Forms.questions(sec, cfg);
  if (s.id === "prefs") form = Forms.prefs(sec, cfg);
  if (s.id === "mail") form = Forms.mailbox(sec, cfg);
}

// A reinstall or a new computer: offer the application history the app finds in its folder.
async function offerHistory() {
  const h = await window.ja.api("/api/history");
  const host = document.getElementById("history-found");
  if (!host || !h.backup || !h.backup.count || h.local >= h.backup.count) return;
  host.innerHTML = `<div class="card sec"><h3>Welcome back</h3>
    <p style="margin:8px 0 12px">Found your application history: <b>${h.backup.count} job${h.backup.count === 1 ? "" : "s"}</b> you applied to, saved ${new Date(h.backup.exportedAt).toLocaleDateString()}. Import it so the app never applies to them again.</p>
    <div class="row-actions"><button class="btn primary" id="hist-import">Import my history</button></div><div id="hist-msg" style="margin-top:10px"></div></div>`;
  document.getElementById("hist-import").onclick = async () => {
    const r = await window.ja.api("/api/history/import", { fromBackup: true });
    msg(document.getElementById("hist-msg"), r.error ? "err" : "ok", r.error || Forms.importedText(r));
    if (!r.error) document.getElementById("hist-import").disabled = true;
  };
}

document.getElementById("back").onclick = () => show(Math.max(0, i - 1));
document.getElementById("skip").onclick = () => show(i + 1);
document.getElementById("next").onclick = async () => {
  const btn = document.getElementById("next"), err = document.getElementById("err");
  btn.disabled = true;
  try {
    if (STEPS[i].id === "welcome") {
      if (!document.getElementById("terms").checked) {
        const box = document.getElementById("terms");
        box.scrollIntoView({ block: "center", behavior: "smooth" }); box.focus();
        return msg(err, "err", "Tick the box at the bottom (\"I understand, and I will check the applications it sends\") to continue.");
      }
      await window.ja.api("/api/settings", { acceptedTerms: true });
      // The kind of work sets sensible defaults: where to look and which titles to suggest.
      const kind = (document.querySelector("[name=kind]:checked") || {}).value || "both";
      if (kind !== cfg.prefs.jobKind || !cfg.prefs.titles.length) {
        const boards = { ...cfg.prefs.boards, freehire: kind !== "hourly", hiringcafe: true };
        const seniority = kind === "hourly" ? ["junior", "middle"] : cfg.prefs.seniority;
        cfg.prefs = await window.ja.api("/api/prefs/save", { prefs: { jobKind: kind, boards, seniority } });
      }
    }
    if (form) { const e = await form.save(); if (e) return msg(err, "err", e); }
    if (STEPS[i].id === "start") {
      const r = await window.ja.api("/api/onboarding/finish", {});
      if (r.error) return msg(err, "err", r.error);
      return window.ja.go("index.html");
    }
    show(i + 1);
    window.scrollTo(0, 0);
  } finally { btn.disabled = false; }
};

(async () => {
  cfg = await window.ja.api("/api/config");
  show(0);
})();
</script>
</body>
</html>
