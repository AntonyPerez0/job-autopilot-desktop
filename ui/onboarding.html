<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ap-file:; frame-src ap-file:; connect-src 'self'">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Set up Job Autopilot: connect an AI, add your resume, and choose the jobs to look for.">
<title>Job Autopilot setup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="icons.js"></script>
<script>document.documentElement.dataset.platform = (window.ja && window.ja.platform) || "";</script>
<div class="app-top" aria-hidden="true"></div>
<div class="wiz">
  <aside class="wiz-side">
    <div class="brand"><div class="logo"><svg class="i" aria-hidden="true"><use href="#i-bolt"/></svg></div>Job Autopilot</div>
    <div id="steps"></div>
  </aside>
  <main class="wiz-main">
    <div id="step"></div>
    <div class="wiz-foot"><button class="btn" id="back">Back</button><div id="err" role="alert"></div><div class="right"><button class="btn ghost" id="skip" hidden>Skip</button><button class="btn primary" id="next">Continue</button></div></div>
  </main>
</div>
<script src="forms.js"></script>
<script>
const { esc, icon, msg } = Forms;
// Five short steps between the welcome and the start; the mailbox and everything optional come later, when useful.
const STEPS = [
  { id: "welcome", label: "Welcome" },
  { id: "ai", label: "Connect AI", title: "Connect an AI", lead: "Job Autopilot uses an AI to read job postings and fill in forms. Connect it once, and you're set." },
  { id: "resumes", label: "Your resume", title: "Your resume", lead: "Add the resume you have, or make one here by telling the app about your work. Either takes a few minutes." },
  { id: "review", label: "Check it", title: "Check your resume", lead: "Read each part. Only what you approve here is ever sent to an employer." },
  { id: "questions", label: "About you", title: "About you", lead: "Application forms ask these every time." },
  { id: "prefs", label: "Jobs to look for", title: "What jobs to look for", lead: "The kind of job you want, and where. You can change this any time." },
  { id: "start", label: "Start" },
];
let i = 0, cfg = null, form = null;

function drawSteps() {
  document.getElementById("steps").innerHTML = STEPS.map((s, k) => `<div class="wiz-step ${k === i ? "on" : k < i ? "done" : ""}" data-k="${k}"><span class="n">${k < i ? "&#10003;" : k + 1}</span>${s.label}</div>`).join("");
  document.querySelectorAll(".wiz-step").forEach((e) => e.onclick = () => { const k = Number(e.dataset.k); if (k < i) show(k); });
}

function show(k) {
  i = k; form = null;
  // Closed partway through? Setup opens here again next time.
  window.ja.api("/api/settings", { setupStep: i });
  msg(document.getElementById("err"), "", "");
  const s = STEPS[i];
  const el = document.getElementById("step");
  document.getElementById("back").style.visibility = i ? "visible" : "hidden";
  document.getElementById("skip").hidden = !s.optional;
  document.getElementById("next").textContent = i === STEPS.length - 1 ? "Start practicing" : i === 0 ? "Get started" : "Continue";
  drawSteps();
  if (s.id === "welcome") {
    el.innerHTML = `<h1>Apply to jobs while you do something else</h1>
      <p class="lead">Job Autopilot finds jobs that fit you, makes a one-page resume for each one, and fills in the application for you. Setting it up takes about ten minutes.</p>
      <div class="card sec"><h2>What kind of work are you looking for?</h2>
        <div class="kind-cards">${[["hourly", "Hourly and everyday jobs", "Retail, food, warehouse, driving, healthcare support, customer service"],
          ["office", "Office, tech and professional jobs", "Software, data, admin, finance, marketing, design"],
          ["both", "Both", "Show me everything that fits"]].map(([v, t, d]) => `<label class="jobkind ${(cfg.prefs.jobKind || "both") === v ? "on" : ""}"><input type="radio" name="kind" value="${v}" ${(cfg.prefs.jobKind || "both") === v ? "checked" : ""}><b>${t}</b><small>${d}</small></label>`).join("")}</div></div>
      <div class="card sec"><h2>What it will and won’t do</h2><ul class="bul" style="margin-top:12px">
        <li>It starts in <b>practice mode</b>: it fills in an application but doesn't send it, so you can check it first.</li>
        <li>It only says what's true: things from the resume you approve and the answers you give. When it doesn't know an answer, it asks you.</li>
        <li>It sends at a steady pace (10 a day to start) and never to the same job twice.</li>
        <li>Everything stays on this computer, except what goes to the AI and to the job sites themselves.</li></ul></div>
      <div class="card sec"><h2>Before you start</h2>
        <p style="margin:8px 0 12px">Applying with an app may go against the terms of some job sites or employers, and some employers may treat it differently. You are responsible for every application sent in your name, so check the practice applications before anything is sent.</p>
        <label class="check"><input type="checkbox" id="terms" ${cfg.settings.acceptedTerms ? "checked" : ""}>I understand. I'll check the practice applications before anything is sent.</label></div>
      <div id="history-found"></div>`;
    offerHistory();
    document.querySelectorAll("[name=kind]").forEach((r) => r.onchange = () => document.querySelectorAll(".jobkind").forEach((k) => k.classList.toggle("on", k.querySelector("input").checked)));
    return;
  }
  if (s.id === "start") {
    const s0 = cfg.settings;
    el.innerHTML = `<h1>You're ready to practice</h1>
      <p class="lead">The app looks for jobs now and fills in the first good one, but doesn't send it. Then it waits for you to check it.</p>
      <div class="card sec"><h2>What happens next</h2><ol class="bul" style="margin-top:12px">
        <li>When your practice application is ready, the Overview shows it at the top of your to-do list.</li>
        <li>Open it and look at the answers, the resume and the screenshots.</li>
        <li>If it looks right, press <b>Looks right: start sending</b>. If something's wrong, press <b>Something's wrong</b> and fix it right there.</li></ol></div>
      <div class="card sec"><h2>While it works</h2><div class="form" style="margin-top:12px">
        <label class="check"><input type="checkbox" id="keepRunning" ${s0.keepRunning !== false ? "checked" : ""}><span>Keep working when I close the window <span class="muted">(open it again from the ${(window.ja && window.ja.platform) === "darwin" ? "menu bar at the top of the screen" : "system tray, next to the clock"})</span></span></label>
        <label class="check"><input type="checkbox" id="openAtLogin" ${s0.openAtLogin ? "checked" : ""}>Start Job Autopilot when my computer starts</label>
        <label class="check"><input type="checkbox" id="notifications" ${s0.notifications !== false ? "checked" : ""}>Tell me with a notification when something needs me</label></div></div>`;
    return;
  }
  el.innerHTML = `<h1>${s.title}</h1><p class="lead">${s.lead}</p><div class="card sec" id="sec"></div>`;
  const sec = document.getElementById("sec");
  if (s.id === "ai") form = Forms.ai(sec, cfg);
  if (s.id === "resumes") form = Forms.resumes(sec, cfg, () => setTimeout(() => show(i + 1), 600));
  if (s.id === "review") {
    form = Forms.review(sec, cfg, { simple: true });
    // A short resume: the questions that fill the page, before the person approves anything.
    const exp = (cfg.profile && cfg.profile.experience) || [];
    const lines = exp.reduce((n, e) => n + (e.bullets || []).length, 0);
    if (exp.length <= 2 || lines < 12) {
      const fold = document.createElement("details");
      fold.className = "more"; fold.style.marginBottom = "12px";
      fold.innerHTML = `<summary><b>Want a fuller page?</b><span>Optional: a few questions about other work, licenses, records and school that people usually leave out</span></summary><div data-fill style="padding:4px 16px 16px"></div>`;
      sec.parentNode.insertBefore(fold, sec);
      let opened = false;
      fold.ontoggle = async () => {
        if (!fold.open || opened) return;
        opened = true;
        await form.save(); // keep what they ticked so far
        Forms.fillPage(fold.querySelector("[data-fill]"), cfg, () => { form = Forms.review(sec, cfg, { simple: true }); });
      };
    }
  }
  if (s.id === "questions") form = Forms.questions(sec, cfg, { setup: true });
  if (s.id === "prefs") form = Forms.prefs(sec, cfg, { setup: true });
}

// A reinstall or a new computer: offer the application history the app finds in its folder.
async function offerHistory() {
  const h = await window.ja.api("/api/history");
  const host = document.getElementById("history-found");
  if (!host || !h.backup || !h.backup.count || h.local >= h.backup.count) return;
  host.innerHTML = `<div class="card sec"><h3>Welcome back</h3>
    <p style="margin:8px 0 12px">Found your application history: <b>${h.backup.count} job${h.backup.count === 1 ? "" : "s"}</b> you applied to, saved ${new Date(h.backup.exportedAt).toLocaleDateString()}. Import it so the app never applies to them again.</p>
    <div class="row-actions"><button class="btn primary" id="hist-import">Import my history</button></div><div id="hist-msg" style="margin-top:10px"></div></div>`;
  document.getElementById("hist-import").onclick = async () => {
    const r = await window.ja.api("/api/history/import", { fromBackup: true });
    msg(document.getElementById("hist-msg"), r.error ? "err" : "ok", r.error || Forms.importedText(r));
    if (!r.error) document.getElementById("hist-import").disabled = true;
  };
}

// A problem said once is cleared as soon as the person changes something.
for (const ev of ["input", "change"]) document.getElementById("step").addEventListener(ev, () => { const e = document.getElementById("err"); if (e.querySelector(".msg.err")) msg(e, "", ""); });
document.getElementById("back").onclick = () => show(Math.max(0, i - 1));
document.getElementById("skip").onclick = () => show(i + 1);
document.getElementById("next").onclick = async () => {
  const btn = document.getElementById("next"), err = document.getElementById("err");
  btn.disabled = true;
  try {
    if (STEPS[i].id === "welcome") {
      if (!document.getElementById("terms").checked) {
        const box = document.getElementById("terms");
        box.scrollIntoView({ block: "center", behavior: "smooth" }); box.focus();
        return msg(err, "err", "Tick the box under \"Before you start\" to continue.");
      }
      await window.ja.api("/api/settings", { acceptedTerms: true });
      // The kind of work sets sensible defaults: where to look and which titles to suggest.
      const kind = (document.querySelector("[name=kind]:checked") || {}).value || "both";
      if (kind !== cfg.prefs.jobKind || !cfg.prefs.titles.length) {
        const boards = { ...cfg.prefs.boards, freehire: true, hiringcafe: true };
        const seniority = kind === "hourly" ? ["junior", "middle"] : cfg.prefs.seniority;
        cfg.prefs = await window.ja.api("/api/prefs/save", { prefs: { jobKind: kind, boards, seniority } });
      }
    }
    if (form) { const e = await form.save(); if (e) return msg(err, "err", e); }
    if (STEPS[i].id === "start") {
      await window.ja.api("/api/settings", { keepRunning: document.getElementById("keepRunning").checked, openAtLogin: document.getElementById("openAtLogin").checked,
        notifications: document.getElementById("notifications").checked });
      const r = await window.ja.api("/api/onboarding/finish", {});
      if (r.error) return msg(err, "err", r.error);
      return window.ja.go("index.html");
    }
    show(i + 1);
    window.scrollTo(0, 0);
  } finally { btn.disabled = false; }
};

(async () => {
  cfg = await window.ja.api("/api/config");
  // Pick up where they left off, as far as what's done allows: the terms first, an AI before a resume, a resume before checking it.
  let k = Math.min(Number(cfg.settings.setupStep) || 0, STEPS.length - 1);
  if (k > 0 && !cfg.settings.acceptedTerms) k = 0;
  if (k > 1 && !cfg.hasKey && !/127\.0\.0\.1|localhost/.test((cfg.settings.ai || {}).apiBase || "")) k = 1;
  if (k > 2 && !cfg.profile) k = 2;
  show(k);
  if (k > 0) msg(document.getElementById("err"), "info", "Welcome back: you're where you left off.");
})();
</script>
</body>
</html>
