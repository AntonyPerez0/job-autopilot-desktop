const toDate = (s) => (s ? new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z") : null);
function ago(s) {
  const d = toDate(s); if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";

// A short message, shown long enough to read it (longer for a long one); with an action ("Undo"), a button in it.

function avatar(name, cls = "") {

const cleanTitle = (t) => String(t || "").trim();
// Pay as the posting lists it, said one way wherever it came from: "$17 to $21 an hour", "$52,000 a year".
function pay(s) {
  const t = String(s || "").trim();

const SOURCE = { greenhouse: "Greenhouse", lever: "Lever", ashby: "Ashby", usajobs: "USAJOBS", neogov: "GovernmentJobs.com", calcareers: "CalCareers" };

// Turn a raw reason into a short category a person reads at a glance.
// Every status is a word, an icon and a colour. Amber only for what waits on the person; red only for errors.
function category(j) {
  const r = j.reason || "";
  switch (j.status) {
    case "applied": return { label: "Applied", tone: "green", icon: "check" };
    case "working": return { label: st && st.state.job && st.state.job.practice ? "Practicing now" : "Filling in now", tone: "blue", pulse: true, icon: "bolt" };
    case "submitting": return { label: "Sending", tone: "blue", pulse: true, icon: "send" };
    case "queued": return j.hold_until && toDate(j.hold_until) > Date.now() ? { label: "Waiting for your referral", tone: "blue", icon: "user" } : { label: "Up next", tone: "blue", icon: "clock" };
    case "filled": return { label: "Practice application", tone: "violet", icon: "eye" };
    case "manual": return { label: "Apply yourself", tone: "blue", icon: "ext" };
    case "skipped":
      if (/^screen:|fails a must-have/.test(r)) return { label: "Not a fit", tone: "gray", icon: "skip" };
      if (/closed|404/.test(r)) return { label: "Posting closed", tone: "gray", icon: "skip" };
      if (/account/.test(r)) return { label: "Needs an account", tone: "gray", icon: "skip" };
      if (/already-applied list|already applied/.test(r)) return { label: "Already applied", tone: "gray", icon: "skip" };
      return { label: "Not applied", tone: "gray", icon: "skip" };
    case "failed":
      if (/may have gone through/.test(r)) return { label: "May have gone through", tone: "amber", icon: "alert" };
      if (/security code|verify email/.test(r)) return { label: "Email code needed", tone: "amber", icon: "mail" };
      if (/captcha/i.test(r)) return { label: "Needs you: CAPTCHA", tone: "amber", icon: "alert" };
      if (/needs you|no answer|still empty/.test(r)) return { label: "Needs your answer", tone: "amber", icon: "alert" };
      return { label: "Not sent", tone: "red", icon: "alert" };
  }
  return { label: j.status, tone: "gray" };
}
const STAGE_BADGE = { interviewing: { label: "Interviewing", tone: "green", icon: "user" }, offer: { label: "Offer", tone: "green", icon: "check" }, rejected: { label: "Not selected", tone: "gray" }, withdrew: { label: "You withdrew", tone: "gray" } };
const badge = (c) => `<span class="badge ${c.tone}">${c.pulse ? '<span class="spin" aria-hidden="true"></span>' : c.icon ? icon(c.icon) : ""}${esc(c.label)}</span>`;

const quiet = (j) => j.status === "applied" && !j.reply && !j.stage && (Date.now() - (toDate(j.applied_at) || Date.now())) > 21 * 86400000;
// Replies from employers, found in the connected mailbox.
const REPLY = { offer: ["Offer", "green"], interview: ["Wants to talk", "green"], assessment: ["Test or task", "blue"], info: ["Needs something from you", "amber"], rejection: ["Not selected", "gray"], other: ["Replied", "blue"] };
const replyBadge = (k) => (k && REPLY[k] ? `<span class="badge ${REPLY[k][1]} reply-badge">${icon("mail", 'style="width:13px;height:13px"')}${REPLY[k][0]}</span>` : "");
const replyItem = (r) => `<div class="list-item" data-open-job="${esc(r.slug)}">${avatar(r.company)}<div class="li-main"><div class="t">${jobLink(r)}</div><div class="s">${meta(esc(r.company), esc(r.subject))}</div></div>
  ${replyBadge(r.kind)}<span class="time hide-md">${ago(r.at)}</span></div>`;
async function checkReplies(btn) {
  btn.disabled = true;

// Why an application is where it is, as a sentence a person can act on. The app's own short notes ("no submit button
// found") are put in plain words with the way forward; anything else starts with a capital.
const PLAIN_REASON = [
  [/^no submit button found/, "The app couldn't find the button that sends this form.", "Press Finish it with me: the app fills it in, and you press the button."],
  [/^resume would not fit on one page/, "Your resume for this job didn't fit on one page.", "On the Resume page, shorten or untick a few lines, then press Try again."],
  [/^the form kept asking for more after \d+ pages/, "This form has more pages than the app goes through.", "Press Finish it with me to do the rest in a window in front of you."],
  [/^(a CAPTCHA challenge|an image CAPTCHA) blocked the submit/, "The site asked for proof that you're a person (a CAPTCHA), which the app never does for you.", "Press Finish it with me: you do that part and press Submit."],
  [/^page (\d+) was not accepted:?\s*(.*)/, (m) => `The site didn't accept page ${m[1]} of the form${m[2] ? `: ${m[2].replace(/\.$/, "")}` : ""}.`, "Press Finish it with me to see what it wants."],
  // Applications that stopped before the app put these in plain words itself.
  [/Target (page|closed)|browser has been closed/, "The browser window was closed while the app was filling this in.", "Press Try again."],
  [/net::ERR_|Timeout \d+ms exceeded|Call log:|^(page|locator|frame)\.\w+: /, "The job site didn't load, or took too long to answer.", "Press Try again later, or Finish it with me."],
  [/^submitted but no confirmation appeared:?\s*(.*)/, (m) => `Submit was pressed, but the site showed no confirmation${m[1] ? `: ${m[1].replace(/\.$/, "")}` : ""}.`, ""],
];
// What the worker adds when Submit was pressed and nothing confirmed it.
const MAYBE_RX = /\.? ?Submit was pressed, so it may have gone through\. Check your email before using Try again\.$/;
function humanReason(j) {
  const r = j.reason || "";
  if (j.status === "applied") return "Submitted and confirmed by the employer.";
  if (/^screen:/.test(r)) return cap1(r.replace(/^screen:\s*/, ""));
  if (/^(dry|practice) run: /.test(r)) return "Practice application, not sent: " + r.replace(/^(dry|practice) run: /, "").replace(/\bnot submitted\b/, "not sent");
  if (/^could not fill every required field/.test(r)) return "Waiting for your answer: " + r.replace(/^could not fill every required field( \(page \d+\))?:\s*/, "").replace(/(required, no answer|needs you|still empty): /g, "");
  const maybe = MAYBE_RX.test(r), t = r.replace(MAYBE_RX, "").replace(/^(error|Apply yourself): /, "");
  // With Submit pressed, the way forward is the same whatever stopped it: look for the employer's email first.
  const after = maybe ? " It may have gone through: look in your email for the employer's thank-you, then say here whether it did." : "";
  if (/^security code/.test(t)) return "The employer emailed a code to confirm it's you, and the app couldn't read it." + (maybe ? " Connect your mailbox in Settings (or check that it's the one your applications use), then press It didn't: try again." : " Connect your mailbox in Settings, and the app finishes this on its own.");
  for (const [rx, to, next] of PLAIN_REASON) { const m = t.match(rx); if (m) return (typeof to === "string" ? to : to(m)) + (maybe ? after : next ? " " + next : ""); }
  return cap1(t) + (maybe && !/may have gone through/.test(t) ? after : "");
}
const cap1 = (t) => String(t).replace(/^[a-z]/, (c) => c.toUpperCase());

// ---------- shell ----------
const NAV_TONE = { applied: "done", queued: "work", failed: "attn", manual: "work", filled: "practice" };
function renderNav() {
  const c = (st && st.counts) || {};
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  const count = (v) => v.id === "all" ? total : v.status ? (c[v.status] || 0) + (v.id === "queued" ? (c.working || 0) : 0) : null;
  const html = (mobile) => VIEWS.map((v, i) => `${!mobile && v.id === "applied" ? '<div class="nav-label">Applications</div>' : ""}${!mobile && v.id === "all" ? '<div class="nav-label adv">More</div>' : ""}
    <a class="nav ${view === v.id ? "on" : ""} ${v.adv ? "adv" : ""}" href="#${v.id}" ${view === v.id ? 'aria-current="page"' : ""} data-go="${v.id}">${icon(v.icon)}<span>${v.label}</span>${count(v) !== null && !mobile ? `<span class="count ${count(v) > 0 ? NAV_TONE[v.id] || "" : ""}">${count(v)}</span>` : ""}</a>`).join("");

  $("mnav").innerHTML = html(true);
}
// The mode, in words, with the one thing to press: Practice mode (nothing is sent) [Start sending], Sending [Pause],
// Paused [Continue]. In the sidebar, and above the pages in a narrow window.
function modeBox(compact) {
  const s = st.settings, p = st.practice || { count: 0, unchecked: 0 };
  const line = (tone, word, text, buttons) => `<div class="mode-line ${tone}"><b id="${compact ? "mmode-txt" : "mode-txt"}">${word}</b>${compact ? "" : `<span class="mode-text">${text}</span>`}</div><div class="mode-acts">${buttons}</div>`;
  const id = (x) => (compact ? "m-" : "") + x;
  if (s.paused) return line("paused", "Paused", s.dryRun ? "Nothing is filled in. Continue goes back to practicing." : "Nothing is filled in or sent. Continue goes back to sending.",
    `<button class="btn sm primary" id="${id("pause")}">${icon("play")}Continue</button>`);
  if (s.dryRun) return line("practice", "Practice mode", `Nothing is sent.${p.count ? ` ${p.count} practice application${p.count === 1 ? "" : "s"} to check.` : ""}`,
    `<button class="btn sm primary" id="${id("start")}">${icon("send")}Start sending</button><button class="btn sm ghost" id="${id("pause")}">${icon("pause")}Pause</button>`);
  return line("sending", "Sending", "Applications go out in your name.",
    `<button class="btn sm" id="${id("pause")}">${icon("pause")}Pause</button><button class="btn sm ghost" id="${id("practice")}">Back to practice</button>`);
}
const modeHtml = {};
function renderControls() {
  if (!st) return;

  // Drawn again only when it changes, so a button the keyboard is on keeps the focus.
  for (const [id, compact] of [["mode-box", false], ["mmode", true]]) { const h = modeBox(compact); if (modeHtml[id] !== h) { $(id).innerHTML = h; modeHtml[id] = h; } }
  $("cap").textContent = s.dailyCap;
  $("cap-dn").disabled = s.dailyCap <= 1; $("cap-up").disabled = s.dailyCap >= 100;
  $("daystart").textContent = new Date(2000, 0, 1, s.dayStartsAtHour || 0).toLocaleTimeString([], { hour: "numeric" });
  $("model").textContent = "Model: " + st.model;
  applyMode(s.uiMode);
  if (!sizing) sideWidth(s.sideWidth);

// The sidebar's width, the person's own: dragged at its edge, or the arrow keys on it (Home and End: as narrow and as
// wide as it goes); a double-click puts it back. The style sheet keeps it within what fits, whatever is asked for.
let sizing = false;
function sideWidth(px) {
  const root = document.documentElement, grip = $("side-grip");
  if (px > 0) root.style.setProperty("--side-set", px + "px"); else root.style.removeProperty("--side-set");
  // Worked out the way the style sheet does, not measured: with "reduce motion" on, a measurement right after a
  // change still gives the width from before it.
  const rem = parseFloat(getComputedStyle(root).fontSize) || 16;
  const lo = 14 * rem, hi = Math.max(lo, Math.min(26 * rem, 0.4 * innerWidth));

const keepSideWidth = async (px) => { const w = px > 0 ? sideWidth(px) : 0; if (!px) sideWidth(0); if (st) st.settings.sideWidth = w; await api("/api/settings", { sideWidth: w }); };
{
  const grip = $("side-grip");
  grip.addEventListener("pointerdown", (e) => {
    if (e.button) return;
    e.preventDefault();
    sizing = true; document.body.classList.add("sizing");
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener("pointermove", (e) => { if (sizing) sideWidth(Math.max(1, Math.round(e.clientX))); });
  const done = (e) => {
    if (!sizing) return;
    sizing = false; document.body.classList.remove("sizing");
    if (grip.hasPointerCapture(e.pointerId)) grip.releasePointerCapture(e.pointerId);
    keepSideWidth(Number(grip.getAttribute("aria-valuenow")));
  };
  grip.addEventListener("pointerup", done);
  grip.addEventListener("pointercancel", done);
  grip.addEventListener("dblclick", () => keepSideWidth(0));

    const now = Number(grip.getAttribute("aria-valuenow")), step = e.shiftKey ? 48 : 16;
    const to = { ArrowLeft: now - step, ArrowRight: now + step, Home: Number(grip.getAttribute("aria-valuemin")), End: Number(grip.getAttribute("aria-valuemax")) }[e.key];
    if (to === undefined) return;
    e.preventDefault();

  });

}
// The update button lives in three places: the sidebar (always), Settings > Updates, and a banner when one is out.
function updateSide() {

  const v = esc(st.version);
  if (u.info && u.info.newer && u.packaged && ["available", "error"].includes(u.phase)) {
    return `<button class="btn sm primary" style="width:100%;justify-content:center" onclick="installUpdate()">${icon("upload")}Update to ${esc(u.info.latest)}</button>`;
  }
  if (["downloading", "waiting", "installing"].includes(u.phase)) {
    return `<div class="muted">${u.phase === "downloading" ? `Downloading update: ${Math.round((u.progress || 0) * 100)}%` : u.phase === "waiting" ? "Update ready, finishing the current application" : "Installing update, restarting"}</div>`;
  }

function updateCard() {
  const u = st.update || {};
  const cur = esc(st.version);
  const pct = Math.round((u.progress || 0) * 100);
  let line, btn = "";
  if (!u.packaged) line = `You're running Job Autopilot from source (version ${cur}); updates install only in the installed app.`;

  else if (u.info && u.info.newer && u.phase === "available") line = `<b>Version ${esc(u.info.latest)} is available.</b> You have ${cur}. Press Update now: the app downloads it, finishes any application in progress, then restarts with the new version. Your data and settings stay.`;
  else if (u.phase === "downloading") line = `<b>Downloading version ${esc(u.info.latest)}: ${pct}%</b><div class="bar" style="margin-top:8px;max-width:420px"><i style="width:${pct}%"></i></div>`;
  else if (u.phase === "waiting") line = `<b>Version ${esc(u.info.latest)} is downloaded.</b> The application in progress finishes first, then the app restarts.`;
  else if (u.phase === "installing") line = `<b>Installing version ${esc(u.info.latest)}.</b> The app closes and opens again in a moment.`;
  else if (u.phase === "error") line = `<b>The update did not install.</b> ${esc(u.error || "")}`;
  else if (u.phase === "checkfailed") line = `Version ${cur}. ${esc(u.error || "Could not check for updates.")}`;

  else line = `Version ${cur}. The app checks for new versions when it starts and every few hours.`;
  const canInstall = u.packaged && u.info && u.info.newer && ["available", "error"].includes(u.phase);

function progressCard() {

      <div class="prog-foot"><span>Step ${cur + 1} of ${steps.length}: ${esc(cur >= 0 ? steps[cur].label : "Starting")}</span><span><span class="fig">${mmss(inStep * 1000)}</span> on this step</span>

let finishSaid = 0;
function finishNews() {
  const d = st && st.state.finishDone;
  if (!d || d.at <= finishSaid) return;
  const first = !finishSaid;

  if (first && Date.now() - d.at > 60000) return; // from before this window opened
  toast(d.status === "applied" ? `Sent: ${d.title} at ${d.company}.`
    : d.maybe ? "Stopped. A button that sends it was pressed, so it may have gone through: check your email before trying again."
      : d.status === "skipped" ? "That posting has closed, so it moved to Not applied."

          : d.outcome === "timeout" ? "Finishing it ran out of time. It's back where it was."
            : d.outcome === "error" ? `Finishing it stopped: ${d.error || "something went wrong"}`
              : "Stopped. It's back where it was.");

// Questions the app stopped on: the user answers them here and the job goes back in the queue.
function askForm(j) {

    ? `<select name="ask-${i}" class="inp"><option value="">Pick an answer</option>${q.options.map((o) => `<option>${esc(o)}</option>`).join("")}</select>`

// What the posting asks for against the resume (checked without the AI), and whether the job looks real (freehire).

const reqWhy = (x) => { const w = String(x.why || ""), label = (REQ[x.status] || REQ.unchecked)[1]; const t = /resume|\byou\b|\bAI\b/i.test(w) ? w : `${label}: ${w}`; return t.charAt(0).toUpperCase() + t.slice(1); };

  if (!r || r.error) return toast((r && r.error) || "That didn't work");
  const x = r.leftOut, others = x.jobs.length - 1;
  toast(`${x.name} jobs are left out from now on${others > 0 ? `; ${others} more in your list were skipped` : ""}.`, { label: "Undo", run: async () => {
    await api("/api/job/" + encodeURIComponent(r.slug), { action: "notkind-undo", code: x.code, jobs: x.jobs });

async function act(action) {
  if (action === "skip") { const j = open; await skipJob(j.slug, j.status, j.reason); if (open && open.slug === j.slug) await openJob(j.slug); return; }
  const r = await api("/api/job/" + encodeURIComponent(open.slug), { action });
  if (r && r.error) { toast(r.error); return; }
  const said = { skip: "Skipped", reviewed: "Thanks. Start sending for real whenever you're ready.", "applied-myself": "Marked as applied. It won't be applied to again.", "apply-now": "It no longer waits: it's applied to in its turn.",
    retry: open.status === "filled" ? "A new practice application is filled in next." : "It's up next again." };
  toast((said[action] || "It's up next again.") + (["retry", "apply-now"].includes(action) ? whenPaused() : ""));
  await openJob(open.slug); refresh(true);
}

// Simple or Advanced: Simple hides what most people never need (statistics, activity, extra tools).
function applyMode(mode) {
  const m = mode === "advanced" ? "advanced" : "simple";
  document.body.classList.toggle("simple", m === "simple");
  document.querySelectorAll("[data-mode]").forEach((b) => { b.classList.toggle("on", b.dataset.mode === m); b.setAttribute("aria-pressed", String(b.dataset.mode === m)); });
  // A page that Simple hides isn't left open behind it.
  if (m === "simple" && ["all", "log"].includes(view)) go("overview");
}

  const b = e.target.closest("button"); if (!b) return;
  const what = b.id.replace(/^m-/, "");
  if (what === "start") return goLive();
  if (what === "pause") { await api("/api/settings", { paused: !st.settings.paused }); toast(st.settings.paused ? "Continuing" : "Paused: nothing is filled in or sent"); }
  else if (what === "practice") { await api("/api/settings", { dryRun: true }); toast("Back to practice mode: nothing is sent"); }
  const kept = document.activeElement && document.activeElement !== document.body;

$("cap-up").onclick = () => setCap(st.settings.dailyCap + 1);

async function refresh(full) {

}

  if (document.hidden || pressing || Date.now() - lastPoll < (busy ? 2500 : 10000)) return;

// ---------- a job found anywhere: paste its link ----------
function addJobDialog() {
  const m = modal(`<h2>Add a job</h2><p class="muted">Found a job on Google, Simplify, HiringCafe, Indeed or a company's website? Copy its link from your browser's address bar and paste it here.</p>
    <input class="inp" id="aj-url" placeholder="https://..." style="width:100%;margin-top:8px">
    <div id="aj-msg" style="margin-top:10px"></div>
    <div class="row-actions" style="margin-top:14px"><button class="btn primary" id="aj-go">Add it</button><button class="btn" id="aj-close">Close</button></div>`);
  const input = m.querySelector("#aj-url");
  input.focus();
  m.querySelector("#aj-close").onclick = () => m.remove();
  const go = async () => {
    const btn = m.querySelector("#aj-go");
    btn.disabled = true;
    Forms.msg(m.querySelector("#aj-msg"), "info", "Reading the job...");
    const r = await api("/api/jobs/add", { url: input.value });
    btn.disabled = false;
    if (r.error) return Forms.msg(m.querySelector("#aj-msg"), "err", r.error);
    Forms.msg(m.querySelector("#aj-msg"), "ok", r.status === "manual" ? `Added ${r.title} at ${r.company} to Apply yourself: ${r.reason.replace(/^Apply yourself: /, "")}.` : `Added ${r.title} at ${r.company}. The app applies to it next.${whenPaused()}`);
    input.value = "";

  };
  m.querySelector("#aj-go").onclick = go;
  input.onkeydown = (e) => { if (e.key === "Enter") go(); };

// ---------- dry run review, going live, updates ----------
function updateBanner() {
  const u = st.update;
  if (!u || !u.info || !["available", "downloading", "waiting", "installing", "error"].includes(u.phase)) return "";
  if (u.phase === "error" && !u.info.newer) return "";
  const v = esc(u.info.latest);
  const page = `<button class="btn sm" data-open-url="${esc(u.info.url)}">${icon("ext")}What's new</button>`;
  let body, actions = "";
  if (u.phase === "available" && u.failed === u.info.latest) {
    // The app closed to update and came back as it was: the computer didn't let it be replaced.
    body = `<b>Version ${v} didn't install</b>The app closed to update itself and came back as version ${esc(u.info.current)}: this computer didn't let it be replaced. Download version ${v} and install it over this one. Your data and settings stay.`;
    actions = `<button class="btn sm primary" data-open-url="${esc(u.info.url)}">${icon("ext")}Download it</button>${u.packaged ? `<button class="btn sm" onclick="installUpdate()">Try again</button>` : ""}`;
  } else if (u.phase === "available") {
    body = `<b>Version ${v} is available</b>You have ${esc(u.info.current)}. Updating keeps all your data and settings, and the app restarts by itself.`;
    actions = u.packaged ? `${page}<button class="btn sm primary" onclick="installUpdate()">${icon("upload")}Update now</button>` : page;
  } else if (u.phase === "downloading") {
    body = `<b>Downloading version ${v}: ${Math.round((u.progress || 0) * 100)}%</b><div class="bar" style="margin-top:8px"><i style="width:${Math.round((u.progress || 0) * 100)}%"></i></div>`;
  } else if (u.phase === "waiting") {
    body = `<b>Version ${v} is ready</b>The application in progress finishes first, then the app restarts with the new version.`;
  } else if (u.phase === "installing") {
    body = `<b>Installing version ${v}</b>The app closes and opens again in a moment.`;
  } else {
    body = `<b>The update did not install</b>${esc(u.error || "")}`;
    actions = `<button class="btn sm" data-open-url="${esc(u.info.url)}">${icon("ext")}Download it instead</button>${u.packaged ? `<button class="btn sm primary" onclick="installUpdate()">Try again</button>` : ""}`;
  }
  return `<div class="banner ${u.phase === "error" || (u.phase === "available" && u.failed === u.info.latest) ? "amber" : "blue"}">${icon("upload")}<div style="flex:1">${body}</div>${actions ? `<div class="right">${actions}</div>` : ""}</div>`;
}
async function installUpdate() {

  refreshStatusOnly(true);
}

// Everything that needs the person, ranked by what holds applications back: prio 0-2 stops everything (the AI, practice

  const pr = st.practice || { count: 0, unchecked: 0 };
  if (s.dryRun && s.reviewedDryRun) add({ prio: 1, urgent: true, tone: "violet", icon: "eye", title: pr.count ? `Practice mode: ${one(pr.count, "application is", "applications are")} filled in, none sent` : "Practice mode: nothing is sent",
    text: `${pr.held ? `${pr.unchecked} new ones since you last looked: the app fills in no more until you open one. ` : pr.unchecked ? `${one(pr.unchecked, "new one", "new ones")} since you last looked. ` : ""}When they look right, start sending: up to ${s.dailyCap} a day, each filled in again and sent in your name.`,
    actions: `${pr.count && pr.first ? `<button class="btn sm" data-open-job="${esc(pr.first.slug)}">Check one</button>` : ""}<button class="btn sm primary" onclick="goLive()">${icon("send")}Start sending</button>` });
  const waiting = st.toAnswer || { count: 0 };

  const gaps = st.missingAnswers || [];

    actions: `<button class="btn sm primary" onclick="openSettings('questions')">Add ${gaps.length === 1 ? "it" : "them"}</button><button class="btn sm ghost" onclick="dismiss('missing-answers')">Not now</button>` });
  const rp = st.replies || {};
  const codes = st.codes || { count: 0 };
  if (codes.count && !rp.mailbox) add({ prio: 3, urgent: true, tone: "amber", icon: "mail", title: `Connect your mailbox to finish ${codes.count === 1 ? "an application" : codes.count + " applications"}`,

  // A mailbox that stopped answering: replies and emailed codes are being missed until it's put right.
  if (rp.mailbox && st.state.mailProblem) add({ prio: 3, urgent: true, tone: "amber", icon: "mail", title: "Your mailbox stopped working", text: `${esc(st.state.mailProblem)} Until then the app can't see replies from employers or read emailed codes.`,
    actions: `<button class="btn sm primary" onclick="openSettings('mailbox')">Open Mailbox settings</button>` });
  const mb = st.maybe || { count: 0 };
  if (mb.count && mb.first) add({ prio: 4, tone: "amber", icon: "mail", title: `${one(mb.count, "application", "applications")} may have gone through`,

  }
  const iv = st.interviews || { count: 0 };
  if (iv.count && iv.first) add({ prio: 5, urgent: true, tone: "green", icon: "bolt", title: `Get ready for your interview with ${esc(iv.first.company)}`,

  const rf = st.referrals || { count: 0 };
  if (rf.count && rf.first) add({ prio: 6, tone: "blue", icon: "user", title: rf.count === 1 ? `You know someone at ${esc(rf.first.company)}` : `You know someone at ${rf.count} of the jobs up next`,

    actions: `<button class="btn sm" onclick="go('manual')">Show them</button>` });
  if (sr && sr.problems && sr.problems.length && !sr.aiProblem) {

    add({ prio: all ? 2 : 8, tone: all ? "red" : "amber", icon: "alert", title: `${all ? "The last search found nothing: " : ""}${sr.problems.map((x) => esc(x.source)).join(" and ")} could not be searched`,
      text: `${esc(sr.problems[0].message)}. ${all && (sr.sources || []).length < 2 ? "It's the only place the app looks right now: turn on another in Settings > Jobs to look for." : "The app tries again on the next search."}`, actions: `<button class="btn sm" onclick="searchNow()">Search now</button>` });
  } else if (sr && sr.at && sr.done && !sr.queued && !sr.toYou && !(sr.skipped && sr.skipped.total) && !c.queued && !c.working && !c.filled && !st.state.job && st.state.now !== "searching") {
    add({ prio: 8, tone: "amber", icon: "search", title: `The last search found nothing to apply to${sr.nextAt ? `. Next search around ${new Date(sr.nextAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : ""}`,
      text: "Job sites had nothing new for these titles near you. Shorter, more common job titles or a wider distance find more.", actions: `<button class="btn sm" onclick="openSettings('prefs')">Change what to look for</button>` });
  } else if (sr && sr.done && sr.skipped && sr.skipped.total && !c.queued && !c.working && !st.state.job && st.state.now !== "searching") {

    text: "Connect your mailbox (the app only reads it) and replies show up here: interviews, tests, questions and answers.", actions: `<button class="btn sm" onclick="openSettings('mailbox')">Connect my mailbox</button><button class="btn sm ghost" onclick="dismiss('mailbox-tip')">Not now</button>` });
  return out.sort((x, y) => x.prio - y.prio);

// A dialog: announced as one, named by its heading, the page behind locked while it's open,
// Escape closes it, and the focus goes back to where it was.
function modal(html) {
  const back = document.activeElement;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const box = bg.firstElementChild, h = box.querySelector("h2, h3");
  if (h) { h.id = h.id || "modal-title"; box.setAttribute("aria-labelledby", h.id); }
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); bg.remove(); } };
  const remove = bg.remove.bind(bg);
  bg.remove = () => {
    remove();
    document.removeEventListener("keydown", onKey, true);
    document.querySelector(".app").inert = $("drawer").classList.contains("open");
    if (back && back.isConnected) focusSoon(() => back);
  };
  document.addEventListener("keydown", onKey, true);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.append(bg);
  document.querySelector(".app").inert = true;
  focusSoon(() => box.contains(document.activeElement) ? document.activeElement : box.querySelector("input, select, textarea, button"));
  return bg;
}

    ${waiting ? `<label class="check"><input type="checkbox" id="m-also" checked><span>${waiting === 1 ? "Also send your practice application, if its posting is still open (it's filled in again first)" : `Also send the ${waiting} practice applications whose postings are still open (each is filled in again first)`}</span></label>` : ""}
    <p class="muted">Pause any time at the bottom left, or go back to practice.</p>
    <div class="row-actions" style="margin-top:18px"><button class="btn primary" id="m-go">${icon("send")}Start sending</button><button class="btn" id="m-close">Keep practicing</button></div>`);
  m.querySelector("#m-close").onclick = () => m.remove();
  m.querySelector("#m-go").onclick = async () => {
    const also = !!(m.querySelector("#m-also") || {}).checked;
    m.querySelector("#m-go").disabled = true;
    if (slug) { const r0 = await api("/api/job/" + encodeURIComponent(slug), { action: "reviewed" }); if (r0 && r0.error) { m.remove(); return toast(r0.error); } }
    const r = await api("/api/golive", { confirm: true });
    if (r.error) { m.remove(); return toast(r.error); }
    const sent = also ? await api("/api/practice/send", {}) : null;
    m.remove();
    closeDrawer();
    toast(sent && sent.queued ? `Sending for real. ${sent.queued} practice application${sent.queued === 1 ? "" : "s"} go first.` : "Sending for real. Pause any time at the bottom left.");
    refresh(true);
  };
}
// Practice runs sent for real (slugs: some of them, or all): each is filled in again and submitted at the daily pace;
// the ones whose postings closed are left out. afterGoLive: offered right after "Start sending".
function sendPractice(slugs) {
  const n = slugs ? slugs.length : st.counts.filled || 0, s = st.settings;
  const one = slugs && slugs.length === 1;
  const m = modal(`<h2>${one ? "Send this application for real?" : `Send ${n} practice application${n === 1 ? "" : "s"} for real?`}</h2>
    <p>${one ? "The app fills the form in again and sends it in your name" : "Each one is filled in again and sent in your name"}${s.dryRun ? ", even though the rest stay in practice mode" : ""}: up to <b>${s.dailyCap} a day</b>, ${one ? "first in line" : "before the rest of the jobs up next"}. ${one ? "If the posting has closed, nothing is sent." : "Postings that have closed are left out, and at any one company they go a few days apart, within your monthly limit, so they never look like a flood."}</p>
    <div class="row-actions" style="margin-top:18px"><button class="btn primary" id="m-go">${icon("send")}${one ? "Send it" : "Send them"}</button><button class="btn" id="m-close">Not now</button></div>`);
  m.querySelector("#m-close").onclick = () => m.remove();
  m.querySelector("#m-go").onclick = async () => {
    m.querySelector("#m-go").disabled = true;
    const r = one ? await api("/api/job/" + encodeURIComponent(slugs[0]), { action: "send" }) : await api("/api/practice/send", slugs ? { slugs } : {});
    m.remove();
    if (r && r.error) { toast(r.error); refresh(true); return; }
    toast((one ? "It's next in line to be sent." : `${r.queued} up next to be sent${r.closed ? `; ${r.closed} had closed` : ""}.`) + whenPaused());
    if (open && one) await openJob(slugs[0]);
    refresh(true);
  };
}
// "Something's wrong" with a practice application: fix it where it is.
function somethingWrong() {
  const practice = st.settings.dryRun;
  const m = modal(`<h2>What's wrong?</h2><p class="muted">Nothing has been sent.</p>
    <div class="wrong-list">
      <button class="btn" id="w-answer">${icon("user")}<span><b>An answer it gave</b><small>${practice ? "Change it here: the app fills in a new practice application with your answer" : "Change it here, and it's sent with your answer"}</small></span></button>
      <button class="btn" id="w-resume">${icon("file")}<span><b>A line on my resume</b><small>Something that isn't true, or isn't said right</small></span></button>
      <button class="btn" id="w-jobs">${icon("search")}<span><b>It's the wrong kind of job</b><small>Change the job titles or where it looks</small></span></button>
      <button class="btn" id="w-other">${icon("help")}<span><b>Something else</b><small>Keep practicing for now</small></span></button></div>`);
  m.querySelector("#w-answer").onclick = () => { m.remove(); dtab = "answers"; renderDrawer(); const b = $("drawer").querySelector("[data-edit-answer]"); if (b) { b.scrollIntoView({ block: "center" }); b.focus(); } toast("Press Change next to the answer that's wrong."); };
  m.querySelector("#w-resume").onclick = () => { m.remove(); closeDrawer(); go("profile"); toast(practice ? "Fix the line, then open the practice application and press More > Fill it in again as practice." : "Fix the line: the next applications use it."); };
  m.querySelector("#w-jobs").onclick = () => { m.remove(); closeDrawer(); openSettings("prefs", "titles"); };
  m.querySelector("#w-other").onclick = () => { m.remove(); toast(practice ? "Still practicing: nothing is sent until you start sending." : "Nothing more is sent from this one until you choose."); };
}

// A diagnostics report: one file with what the app tried and where it stopped, to send to whoever helps.
async function saveDiagnostics(btn) {
  const m = $("diag-msg");
  btn.disabled = true;
  Forms.msg(m, "info", "Making the report...");
  try {
    const r = await window.ja.saveDiagnostics($("diag-personal").checked);
    if (!r) return Forms.msg(m, "", "");
    Forms.msg(m, "ok", `Saved: ${r.file} (${Math.max(1, Math.round(r.bytes / 1024))} KB). Its folder is open: send the file to whoever helps you with the app.`);
  } catch (e) { Forms.msg(m, "err", String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, "")); }
  finally { btn.disabled = false; }
}

// ---------- profile and settings ----------
let cfg = null;
async function renderConfig() {
  cfg = await api("/api/config");
  // Each section folds away; the ones people change most start open.
  // The save bar shows up once something in the section changes, and stays in view until it's saved.
  const card = (id, title, sub, open, adv) => `<details class="card card-fold ${adv ? "adv" : ""}" id="card-${id}" ${open ? "open" : ""}><summary><div class="card-h"><h2>${title}</h2><span class="sub">${sub || ""}</span></div></summary>
    <div class="sec" id="sec-${id}"></div><div class="save-bar" hidden><span class="unsaved">${icon("alert")}Changes here aren't saved yet</span><button class="btn primary" data-save="${id}">${icon("check")}Save changes</button><div id="msg-${id}" style="flex:1"></div></div></details>`;
  if (view === "profile") {
    const fold = (id, title, sub, open) => `<details class="card card-fold" ${open ? "open" : ""}><summary><div class="card-h"><h2>${title}</h2><span class="sub">${sub}</span></div></summary><div class="sec" id="sec-${id}"></div></details>`;
    drawPage(`<div id="cfg-host">
      ${cfg.profile ? fold("studio", "Check &amp; improve", "What a recruiter will notice, and better wording for your lines", true) : ""}
      ${fold("create", "Make a resume with me", "Answer a few questions; the app writes the lines, you approve them", !cfg.profile)}
      ${card("review", "All your resume pieces", "Edit, approve or delete each line; only approved ones are ever used")}
      <div class="adv">${fold("github", "Projects from GitHub", "Pick your public projects; the app writes lines about them for you to approve")}</div>

    const added = () => { forms.review = Forms.review($("sec-review"), cfg); const d = $("sec-review").closest("details"); d.open = true; d.scrollIntoView({ behavior: "smooth" }); if (studio) studio.refresh(); toast("Added. Check and approve the new lines below."); };
    Forms.creator($("sec-create"), cfg, added);

      ${card("questions", "About you", "The answers application forms ask for")}
      <div class="card" id="card-yours" style="margin-bottom:12px"><div class="card-h"><h2>Your answers to form questions</h2><span class="sub">Questions you answered when an application stopped; the app uses them again</span></div><div class="sec" id="sec-yours"></div></div>
      <div class="card" id="card-people" style="margin-bottom:12px"><div class="card-h"><h2>People you know</h2><span class="sub">Optional: ask for a referral where you know someone</span></div><div class="sec" id="sec-people"></div></div>
      ${card("ai", "AI", "The AI service the app uses")}
      ${card("mailbox", "Mailbox", "Optional: see replies from employers, and let the app finish forms that email a code")}
      ${card("background", "While it works", "Closing the window, starting with your computer, notifications")}
      ${card("accounts", "Job site accounts", "Optional: let the app make accounts on Workday sites and apply there too")}
      ${card("running", "Pace and browser", "How many a day, and the browser window", false, true)}
      <div class="card adv" style="margin-bottom:12px"><div class="card-h"><h2>Application history</h2><span class="sub">So you never apply twice, even after a reinstall</span></div><div class="sec" id="sec-history"></div></div>
      <div class="card" id="card-theme" style="margin-bottom:12px"><div class="card-h"><h2>Appearance</h2><span class="sub">Light or dark, text size, and how much to show</span></div><div class="sec" id="sec-theme">
        <div class="radio-row" role="radiogroup" aria-label="Appearance">${[["system", "Match my computer"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) =>

          `<label><input type="radio" name="textSize" value="${v}" ${Number(cfg.settings.textSize || 1) === v ? "checked" : ""}>${l}</label>`).join("")}</div>
          <small>Makes everything in the window bigger. Ctrl and + or - (Cmd on a Mac) zooms too.</small></div>

          `<label><input type="radio" name="uiMode" value="${v}" ${(cfg.settings.uiMode || "simple") === v ? "checked" : ""}>${l}</label>`).join("")}</div></div></div></div>
      <div class="card" style="margin-bottom:12px"><div class="card-h"><h2>Updates</h2></div><div class="sec" id="update-card">${updateCard()}</div></div>

async function drawYours() {
  const host = $("sec-yours"); if (!host) return;
  const list = await api("/api/your-answers");
  host.innerHTML = list.length ? `<div class="sub-list">${list.map((x, i) => `<div class="sub-item yours"><div><b>${esc(x.label)}</b><div>${esc(x.value)}</div>
      <small class="muted">${x.scope === "all" ? "Used for every application that asks this" : `Only for ${esc(x.company || "one job")}`}</small></div>
      <button class="btn ghost sm" data-i="${i}">${icon("trash")}Remove</button></div>`).join("")}</div>`
    : `<p class="muted" style="margin:0">None yet. When an application stops on a question only you can answer, you answer it in the job's panel and it shows up here.</p>`;
  host.querySelectorAll("[data-i]").forEach((b) => b.onclick = async () => { const x = list[Number(b.dataset.i)]; await api("/api/your-answers/remove", { key: x.key, scope: x.scope }); drawYours(); });
}
// A section of Settings, opened and in view; with field, the setting itself, focused (inside a fold, the fold opened).
function showSection(id, field) {
  const card = $("card-" + id) || ($("sec-" + id) && $("sec-" + id).closest(".card"));
  if (!card) return;
  if (card.tagName === "DETAILS") card.open = true;
  let target = card;
  if (field) {
    const f = card.querySelector(`[name="${CSS.escape(field)}"], [data-${CSS.escape(field)}]`);
    if (f) {
      for (let n = f.parentElement; n && n !== card; n = n.parentElement) if (n.tagName === "DETAILS") n.open = true;
      target = f.closest(".fld") || f.closest(".check, label") || f;
      // The box to type in or choose from; a list of buttons (the kinds left out) only scrolls into view.
      const box = f.matches("input, select, textarea") ? f : f.querySelector("input, select, textarea");
      if (box) setTimeout(() => box.focus({ preventScroll: true }), 350);
    }
  }
  target.scrollIntoView({ block: field ? "center" : "start", behavior: "smooth" });
  if (field) { target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 2200); }
}
// Settings keep what's typed: a section that changes shows its save bar (in view at the bottom of the window) until it's
// saved, and leaving Settings with changes not saved asks first. Settings that save on their own are marked data-nosave.
const dirty = new Set();
function bindSaves(forms) {
  dirty.clear();
  const mark = (e) => {
    if (e.target.closest("[data-nosave]")) return;
    const card = e.target.closest(".card-fold"), bar = card && card.querySelector(".save-bar");
    if (!bar) return;
    const id = bar.querySelector("[data-save]").dataset.save;
    if (!forms[id]) return;
    dirty.add(id); bar.hidden = false; bar.classList.add("dirty");
  };
  for (const ev of ["input", "change"]) $("cfg-host").addEventListener(ev, mark);
  saveAll.forms = forms;
  document.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.save;
    b.disabled = true;
    const e = await forms[id].save();
    b.disabled = false;
    Forms.msg($("msg-" + id), e ? "err" : "ok", e || "Saved.");
    if (!e) {
      dirty.delete(id);
      const bar = b.closest(".save-bar"); bar.classList.remove("dirty");
      setTimeout(() => { if (!dirty.has(id)) bar.hidden = true; }, 1800);
      toast("Saved");
      refreshStatusOnly();
    }
  });
}
// Save every section with changes; the first one that can't be saved is shown, and the answer is false.
async function saveAll() {
  for (const id of [...dirty]) {
    const e = await saveAll.forms[id].save();
    if (e) { showSection(id); Forms.msg($("msg-" + id), "err", e); return false; }
    dirty.delete(id);
  }
  return true;
}
// Leaving Settings with changes not saved: save them, drop them, or stay.
function leaveSettings(then) {
  if (!["settings", "profile"].includes(view) || !dirty.size) return then();
  const names = [...dirty].map((id) => (($("card-" + id) || {}).querySelector ? $("card-" + id).querySelector("h2").textContent : id));
  const m = modal(`<h2>Save your changes?</h2><p>You changed ${names.join(" and ")} without saving.</p>
    <div class="row-actions" style="margin-top:16px"><button class="btn primary" id="lv-save">${icon("check")}Save them</button><button class="btn" id="lv-drop">Don't save</button><button class="btn ghost" id="lv-stay">Stay here</button></div>`);
  m.querySelector("#lv-stay").onclick = () => m.remove();
  m.querySelector("#lv-drop").onclick = () => { dirty.clear(); m.remove(); then(); };
  m.querySelector("#lv-save").onclick = async () => { m.remove(); if (await saveAll()) { toast("Saved"); then(); } };
}
