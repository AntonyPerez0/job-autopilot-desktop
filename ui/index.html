<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: ap-file:; frame-src ap-file:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Job Autopilot finds jobs that match what you want, fills in each application and keeps a record of every one.">
<meta name="color-scheme" content="light dark">
<title>Job Autopilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="simple">
<a class="skip" href="#main" onclick="event.preventDefault();$('main').focus()">Skip to the page</a>
<script src="icons.js"></script>
<script>document.documentElement.dataset.platform = (window.ja && window.ja.platform) || "";</script>
<div class="app-top" aria-hidden="true"></div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg class="i" aria-hidden="true"><use href="#i-bolt"/></svg></div>Job Autopilot</div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-foot">
      <div class="row"><span style="display:flex;align-items:center;gap:8px"><span id="mode-dot" class="dot"></span><b id="mode-txt">…</b></span>
        <button class="btn sm" id="pause"></button></div>
      <div class="row"><span>Go live <span class="muted">(submit for real)</span></span><button class="switch" id="live" role="switch" aria-checked="false" aria-label="Go live: submit applications for real"></button></div>
      <div class="row adv"><span>Day starts</span><span class="muted" id="daystart"></span></div>
      <div class="row adv"><span>Daily limit</span><div class="stepper"><button id="cap-dn" aria-label="Lower">&minus;</button><span id="cap">0</span><button id="cap-up" aria-label="Raise">+</button></div></div>
      <div class="muted adv" id="model"></div>
      <div class="row"><span>Show</span><span class="mode-switch" role="group" aria-label="How much to show"><button type="button" data-mode="simple">Simple</button><button type="button" data-mode="advanced">Advanced</button></span></div>
      <div id="update-side"></div>
    </div>
  </aside>
  <div>
    <nav class="mobile-bar" id="mnav" aria-label="Pages"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="forms.js"></script>
<script>
const VIEWS = [
  { id: "overview", label: "Overview", icon: "grid" },
  { id: "applied", label: "Applied", icon: "send", status: "applied" },
  { id: "queued", label: "Queue", icon: "clock", status: "queued" },
  { id: "failed", label: "Needs attention", icon: "alert", status: "failed" },
  { id: "manual", label: "Apply yourself", icon: "ext", status: "manual" },
  { id: "filled", label: "Filled (dry run)", icon: "eye", status: "filled" },
  { id: "skipped", label: "Skipped", icon: "skip", status: "skipped", adv: true },
  { id: "all", label: "All jobs", icon: "list", adv: true },
  { id: "log", label: "Activity", icon: "act", adv: true },
  { id: "profile", label: "Resume", icon: "file" },
  { id: "settings", label: "Settings", icon: "gear" },
];
const TITLES = {
  overview: ["Overview", "Jobs that match your preferences, found and applied to automatically."],
  applied: ["Applied", "Applications the employer confirmed it received."],
  queued: ["Queue", "Screened as a fit and waiting their turn."],
  failed: ["Needs attention", "Stopped before submitting, so nothing incomplete went out."],
  filled: ["Filled (dry run)", "Filled in and checked, but not submitted."],
  manual: ["Apply yourself", "Good matches on sites that need an account, a chat bot, or a job board. Open each one, apply, then press \"I applied\"."],
  skipped: ["Skipped", "Closed postings, poor fits, and boards that need an account."],
  all: ["All jobs", "Everything the autopilot has seen."],
  log: ["Activity", "What the autopilot did, newest first."],
  profile: ["Resume", "Check it, improve it, make a new one, and download it."],
  settings: ["Settings", "Everything you set up at the start, and how the autopilot runs."],
};
let view = (location.hash.slice(1) || "overview"), st = null, jobsCache = {}, q = "", open = null, dtab = "answers";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (n, extra = "") => `<svg class="i" aria-hidden="true" ${extra}><use href="#i-${n}"/></svg>`;
// Parts of one line of details, set apart by space instead of dots.
const meta = (...parts) => `<span class="meta">${parts.filter(Boolean).map((x) => `<span>${x}</span>`).join("")}</span>`;
const api = (p, body) => window.ja.api(p, body);
const toDate = (s) => (s ? new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z") : null);
function ago(s) {
  const d = toDate(s); if (!d) return "";
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + "m ago";
  const h = Math.round(m / 60); if (h < 24) return h + "h ago";
  const dd = Math.round(h / 24); if (dd < 7) return dd + "d ago";
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}
const fmtTime = (s) => { const d = toDate(s); return d ? d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; };
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); }

function avatar(name, cls = "") {
  const n = String(name || "?").replace(/[^A-Za-z0-9 ]/g, " ").trim();
  const parts = n.split(/\s+/).filter(Boolean);
  const ini = (parts.length > 1 ? parts[0][0] + parts[1][0] : n.slice(0, 2)).toUpperCase();
  return `<div class="avatar ${cls}" aria-hidden="true">${esc(ini)}</div>`;
}
const cleanTitle = (t) => String(t || "").trim();
const SOURCE = { greenhouse: "Greenhouse", lever: "Lever", ashby: "Ashby", usajobs: "USAJOBS", neogov: "GovernmentJobs.com", calcareers: "CalCareers" };

// Turn a raw reason into a short category a person reads at a glance.
function category(j) {
  const r = j.reason || "";
  switch (j.status) {
    case "applied": return { label: "Applied", tone: "green" };
    case "working": return { label: "Applying now", tone: "blue", pulse: true };
    case "submitting": return { label: "Submitting", tone: "blue", pulse: true };
    case "queued": return { label: "Queued", tone: "blue" };
    case "filled": return { label: "Filled (dry run)", tone: "violet" };
    case "manual": return { label: "Apply yourself", tone: "amber" };
    case "skipped":
      if (/^screen:|fails a must-have/.test(r)) return { label: "Not a fit", tone: "gray" };
      if (/closed|404/.test(r)) return { label: "Posting closed", tone: "gray" };
      if (/account/.test(r)) return { label: "Needs an account", tone: "gray" };
      if (/already-applied list|already applied/.test(r)) return { label: "Already applied", tone: "gray" };
      return { label: "Skipped", tone: "gray" };
    case "failed":
      if (/security code/.test(r)) return { label: "Email code needed", tone: "amber" };
      if (/captcha/i.test(r)) return { label: "CAPTCHA", tone: "amber" };
      if (/needs you|no answer|still empty/.test(r)) return { label: "Missing info", tone: "amber" };
      if (/no confirmation/.test(r)) return { label: "Not confirmed", tone: "red" };
      return { label: "Error", tone: "red" };
  }
  return { label: j.status, tone: "gray" };
}
const badge = (c) => `<span class="badge ${c.tone}"><span class="dot ${c.pulse ? "pulse" : ""}"></span>${esc(c.label)}</span>`;
function humanReason(j) {
  const r = j.reason || "";
  if (j.status === "applied") return "Submitted and confirmed by the employer.";
  if (/^screen:/.test(r)) return r.replace(/^screen:\s*/, "");
  if (/security code/.test(r)) return "Greenhouse wants the verification code it emailed. Connect your mailbox in Settings and this retries on its own.";
  if (/^could not fill every required field/.test(r)) return "Waiting for your answer: " + r.replace(/^could not fill every required field( \(page \d+\))?:\s*/, "").replace(/(required, no answer|needs you|still empty): /g, "");
  return r;
}

// ---------- shell ----------
const NAV_TONE = { applied: "done", queued: "work", failed: "attn", manual: "attn", filled: "attn" };
function renderNav() {
  const c = (st && st.counts) || {};
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  const count = (v) => v.id === "all" ? total : v.status ? (c[v.status] || 0) + (v.id === "queued" ? (c.working || 0) : 0) : null;
  const html = (mobile) => VIEWS.map((v, i) => `${!mobile && v.id === "applied" ? '<div class="nav-label">Applications</div>' : ""}${!mobile && v.id === "all" ? '<div class="nav-label adv">More</div>' : ""}
    <a class="nav ${view === v.id ? "on" : ""} ${v.adv ? "adv" : ""}" href="#${v.id}" ${view === v.id ? 'aria-current="page"' : ""} data-go="${v.id}">${icon(v.icon)}<span>${v.label}</span>${count(v) !== null && !mobile ? `<span class="count ${count(v) > 0 ? NAV_TONE[v.id] || "" : ""}">${count(v)}</span>` : ""}</a>`).join("");
  $("nav").innerHTML = html(false);
  $("mnav").innerHTML = html(true);
}
function renderControls() {
  if (!st) return;
  const s = st.settings;
  const mode = s.paused ? ["red", "Paused"] : s.dryRun ? ["amber", "Dry run"] : ["green", "Live"];
  $("mode-dot").className = "dot " + mode[0] + (s.paused ? "" : " pulse");
  $("mode-txt").textContent = mode[1];
  $("pause").innerHTML = s.paused ? `${icon("play")}Resume` : `${icon("pause")}Pause`;
  $("pause").classList.toggle("primary", s.paused);
  $("live").classList.toggle("on", !s.dryRun);
  $("live").setAttribute("aria-checked", String(!s.dryRun));
  $("cap").textContent = s.dailyCap;
  $("daystart").textContent = new Date(2000, 0, 1, s.dayStartsAtHour || 0).toLocaleTimeString([], { hour: "numeric" });
  $("model").textContent = "Model: " + st.model;
  applyMode(s.uiMode);
  $("update-side").innerHTML = updateSide();
  const card = $("update-card"); if (card) card.innerHTML = updateCard();
}
// The update button lives in three places: the sidebar (always), Settings > Updates, and a banner when one is out.
function updateSide() {
  const u = st.update || {};
  const v = esc(st.version);
  if (u.info && u.info.newer && u.packaged && ["available", "error"].includes(u.phase)) {
    return `<button class="btn sm primary" style="width:100%;justify-content:center" onclick="installUpdate()">${icon("upload")}Update to ${esc(u.info.latest)}</button>`;
  }
  if (["downloading", "waiting", "installing"].includes(u.phase)) {
    return `<div class="muted">${u.phase === "downloading" ? `Downloading update: ${Math.round((u.progress || 0) * 100)}%` : u.phase === "waiting" ? "Update ready, finishing the current application" : "Installing update, restarting"}</div>`;
  }
  return `<div class="row"><span class="muted">Version <span class="mono">${v}</span></span><button class="btn ghost sm" onclick="checkUpdate(this)">${u.phase === "checking" ? "Checking..." : "Check for updates"}</button></div>`;
}
function updateCard() {
  const u = st.update || {};
  const cur = esc(st.version);
  const pct = Math.round((u.progress || 0) * 100);
  let line, btn = "";
  if (!u.packaged) line = `You're running Job Autopilot from source (version ${cur}); updates install only in the installed app.`;
  else if (u.phase === "checking") line = "Checking for a new version...";
  else if (u.info && u.info.newer && u.phase === "available") line = `<b>Version ${esc(u.info.latest)} is available.</b> You have ${cur}. Press Update now: the app downloads it, finishes any application in progress, then restarts with the new version. Your data and settings stay.`;
  else if (u.phase === "downloading") line = `<b>Downloading version ${esc(u.info.latest)}: ${pct}%</b><div class="bar" style="margin-top:8px;max-width:420px"><i style="width:${pct}%"></i></div>`;
  else if (u.phase === "waiting") line = `<b>Version ${esc(u.info.latest)} is downloaded.</b> The application in progress finishes first, then the app restarts.`;
  else if (u.phase === "installing") line = `<b>Installing version ${esc(u.info.latest)}.</b> The app closes and opens again in a moment.`;
  else if (u.phase === "error") line = `<b>The update did not install.</b> ${esc(u.error || "")}`;
  else if (u.phase === "checkfailed") line = `Version ${cur}. ${esc(u.error || "Could not check for updates.")}`;
  else if (u.phase === "uptodate") line = `You have the latest version, ${cur}${u.checkedAt ? ` (checked ${new Date(u.checkedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })})` : ""}. New versions show up here and in the sidebar with an Update button.`;
  else line = `Version ${cur}. The app checks for new versions when it starts and every few hours.`;
  const canInstall = u.packaged && u.info && u.info.newer && ["available", "error"].includes(u.phase);
  const busy = ["checking", "downloading", "waiting", "installing"].includes(u.phase);
  btn = `<button class="btn sm primary" onclick="installUpdate()" ${canInstall ? "" : "disabled"} title="${canInstall ? "" : "No new version to install right now"}">${icon("upload")}${u.phase === "error" ? "Try again" : "Update now"}</button>
    <button class="btn sm" onclick="checkUpdate(this)" ${busy ? "disabled" : ""}>${icon("refresh")}Check for updates</button>
    ${u.info && u.info.url ? `<button class="btn sm ghost" data-open-url="${esc(u.info.url)}">${icon("ext")}${u.info.newer ? "What's new" : "Releases page"}</button>` : ""}`;
  return `<p style="margin:0 0 12px">${line}</p><div class="row-actions">${btn}</div>`;
}
function liveChip() {
  const s = st.state, set = st.settings;
  let tone = "green", txt = esc(s.now);
  if (set.paused) { tone = "red"; txt = "Paused"; }
  else if (s.job) { tone = "blue"; txt = `Applying to <b>${esc(s.job.company)}</b>, ${esc(cleanTitle(s.job.title))}`; }
  else if (s.now === "searching") { tone = "blue"; txt = "Searching for new jobs"; }
  else if (/review the first/.test(s.now)) { tone = "amber"; txt = "Waiting for you to check the first filled application"; }
  else if (/cap/.test(s.now)) { tone = "amber"; txt = `Daily limit reached, resumes ${s.resumesAt ? new Date(s.resumesAt).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : "tomorrow"}`; }
  else if (/waiting between/.test(s.now)) txt = "Pacing between applications";
  else if (/queue empty/.test(s.now)) txt = "Queue empty, waiting for the next search";
  const busy = !set.paused && (s.job || s.now === "searching");
  return `<div class="live ${tone}" role="status"><span class="dot ${tone}"></span>${busy ? '<span class="spin" aria-hidden="true"></span>' : ""}<span class="txt">${txt}</span></div>`;
}
function header() {
  const [t, sub] = TITLES[view];
  const list = !["overview", "log", "profile", "settings"].includes(view);
  return `<div class="top"><div><h1>${t}</h1><p>${sub}</p></div><div class="actions">${liveChip()}
    ${list ? `<div class="search">${icon("search")}<input id="q" aria-label="Search jobs" placeholder="Search company, role, location" value="${esc(q)}" oninput="q=this.value;renderList()"></div>` : ""}
    <button class="btn" onclick="addJobDialog()">${icon("plus")}Add a job</button>
    <button class="btn" onclick="searchNow()">${icon("refresh")}Search now</button></div></div><div id="banner-host">${banners()}</div><div id="progress-host">${progressCard()}</div>`;
}

// ---------- progress ----------
const SHORT = { browser: "Browser", open: "Open form", read: "Read form", account: "Sign in", plan: "AI tailoring", build: "Resume + fact-check",
  fill: "Fill form", verify: "Check answers", submit: "Submit", code: "Email code", confirm: "Confirmation" };
let skew = 0;
const now = () => Date.now() + skew;
const mmss = (ms) => { const t = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const left = (sec) => sec < 45 ? "less than a minute left" : `about ${Math.max(1, Math.round(sec / 60))} min left`;
function progressCard() {
  if (!st) return "";
  const p = st.state.progress;
  if (st.settings.paused) return "";
  if (!p) return "";
  if (p.kind === "apply" && st.state.job) {
    const job = st.state.job;
    const steps = p.steps.filter((x) => !["code", "account"].includes(x.key) || p.step === x.key || p.done.includes(x.key));
    const cur = steps.findIndex((x) => x.key === p.step);
    const inStep = (now() - p.stepAt) / 1000;
    let total = 0, doneT = 0;
    steps.forEach((x, i) => { total += x.typical; if (i < cur) doneT += x.typical; });
    const curT = cur >= 0 ? steps[cur].typical : 0;
    const partial = Math.min(inStep, curT * 0.95);
    const pct = Math.min(99, Math.round((100 * (doneT + partial)) / Math.max(1, total)));
    const remaining = Math.max(0, total - doneT - Math.max(inStep, partial));
    const over = cur >= 0 && inStep > curT * 1.5 && inStep > 20;
    return `<div class="card prog">
      <div class="prog-top">${avatar(job.company)}<div class="prog-title"><div class="t">Applying to ${esc(job.company)}</div><div class="s">${esc(cleanTitle(job.title))}</div></div>
        <div class="prog-meta"><b>${pct}%</b><span>${meta(`${mmss(now() - p.startedAt)} elapsed`, over ? "taking longer than usual" : left(remaining))}</span></div></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="steps">${steps.map((x, i) => `<div class="stp ${i < cur ? "done" : i === cur ? "cur" : ""}"><div class="ln"></div>
        <div class="lb" title="${esc(x.label)}">${i < cur ? icon("check") : i === cur ? '<span class="spin"></span>' : ""}${esc(SHORT[x.key] || x.label)}</div></div>`).join("")}</div>
      <div class="prog-foot"><span>Step ${cur + 1} of ${steps.length}: ${esc(cur >= 0 ? steps[cur].label : "Starting")}</span><span><span class="fig">${mmss(inStep * 1000)}</span> on this step</span>
        ${st.browser && st.browser.open && st.browser.mode !== "headless" ? `<a href="#" onclick="showBrowser(true);return false">Show the browser</a><a href="#" onclick="showBrowser(false);return false">Minimize it</a>` : ""}</div></div>`;
  }
  if (p.kind === "search") {
    const searchShare = 35;
    const frac = p.n ? (p.i + 0.5) / p.n : 0;
    const pct = Math.round(p.phase === "search" ? frac * searchShare : searchShare + frac * (100 - searchShare));
    const what = p.phase === "search" ? (p.n ? meta(`Search ${Math.min(p.i + 1, p.n)} of ${p.n}`, p.label ? `“${esc(p.label)}”` : "") : meta("Getting ready to search", ""))
      : meta(`Reviewing new posting ${Math.min(p.i + 1, p.n)} of ${p.n}`, p.label ? esc(p.label) : "");
    return `<div class="card prog">
      <div class="prog-top"><span class="ico">${icon("search")}</span>
        <div class="prog-title"><div class="t">${p.phase === "search" ? "Searching for new jobs" : "Checking new jobs for fit"}</div><div class="s">${what}</div></div>
        <div class="prog-meta"><b>${pct}%</b><span>${meta(`${mmss(now() - p.startedAt)} elapsed`, p.phase === "review" && p.added ? `${p.added} added to the queue` : "")}</span></div></div>
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="prog-foot">${p.phase === "search" ? "Step 1 of 2: searching" : "Step 2 of 2: AI checks each new posting for fit before it joins the queue"}</div></div>`;
  }
  if (p.kind === "wait") {
    const span = Math.max(1, p.until - p.from), gone = now() - p.from;
    const pct = Math.min(100, Math.round((100 * gone) / span));
    const next = st.next;
    return `<div class="card prog">
      <div class="prog-top"><span class="ico">${icon("clock")}</span>
        <div class="prog-title"><div class="t">Next application in ${mmss(p.until - now())}</div>
        <div class="s">${next ? `Up next: ${esc(next.company)}, ${esc(cleanTitle(next.title))}` : "Nothing queued yet"}</div></div>
        <div class="prog-meta"><span>Applications are spaced ${st.settings.minutesBetweenApplies} minutes apart</span></div></div>
      <div class="pbar calm"><i style="width:${pct}%"></i></div></div>`;
  }
  return "";
}
function tickProgress() { const h = $("progress-host"); if (h) h.innerHTML = progressCard(); }

// ---------- overview ----------
async function renderOverview() {
  const [applied, queue, failed, ev] = await Promise.all([api("/api/jobs?status=applied"), api("/api/jobs?status=queued"), api("/api/jobs?status=failed"), api("/api/events")]);
  const c = st.counts, s = st.settings;
  const done = (c.applied || 0), stopped = (c.failed || 0);
  const rate = done + stopped ? Math.round((100 * done) / (done + stopped)) : 0;
  const days = [...Array(14)].map((_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
  const per = days.map((d) => applied.filter((j) => { const a = toDate(j.applied_at); return a && a >= d && a < new Date(+d + 86400000); }).length);
  const max = Math.max(1, ...per);
  const cats = {};
  for (const j of failed) { const k = category(j).label; cats[k] = (cats[k] || 0) + 1; }
  const seen = Object.values(c).reduce((a, b) => a + b, 0);
  const pipe = [["Found", seen], ["Screened in", (c.applied || 0) + (c.queued || 0) + (c.failed || 0) + (c.working || 0) + (c.filled || 0) + (c.manual || 0)], ["Attempted", done + stopped], ["Applied", done]];
  $("main").innerHTML = header() + `
  <div class="grid-kpi adv">
    ${kpi("applied", "Applications sent", done, `${ago(applied[0] && applied[0].applied_at) ? "Last " + ago(applied[0].applied_at) : "None yet"}`)}
    <a class="kpi done" href="#applied" onclick="go('applied');return false"><div class="lbl">Today</div>
      <div class="val">${st.appliedToday}<small>/ ${s.dailyCap}</small></div><div class="bar"><i style="width:${Math.min(100, (100 * st.appliedToday) / Math.max(1, s.dailyCap))}%"></i></div></a>
    ${kpi("queued", "In queue", (c.queued || 0) + (c.working || 0), "Screened as a fit")}
    ${kpi("failed", "Needs attention", stopped, Object.entries(cats).sort((a, b) => b[1] - a[1]).slice(0, 1).map(([k, n]) => `${n}: ${k}`)[0] || "All clear")}
    ${kpi("all", "Success rate", rate + "%", `${done} of ${done + stopped} attempts`)}
  </div>
  <div class="grid-2">
    <div class="stack">
      <div class="card"><div class="card-h"><h2>Recent applications</h2><span class="right"><button class="btn ghost sm" onclick="go('applied')">View all</button></span></div>
        ${applied.length ? applied.slice(0, 6).map(item).join("") : empty("send", "No applications yet", "The first ones will appear here as soon as an employer confirms.")}</div>
      <div class="card adv"><div class="card-h"><h2>Applications per day</h2><span class="sub">Last 14 days</span></div>

// Focus once the element can take it: a panel that is still becoming visible (even for a frame, as with

function focusSoon(get, tries = 10) {

}

document.addEventListener("click", (e) => {
  const t = e.target.closest && e.target.closest("[data-open-job], [data-open-url], [data-go], [data-tab]");
  if (!t) return;

  else if (t.hasAttribute("data-open-url")) { e.preventDefault(); window.ja.openExternal(t.getAttribute("data-open-url")); }
  else if (t.hasAttribute("data-go")) { e.preventDefault(); go(t.getAttribute("data-go")); }

});

function askForm(j) {

  const control = (q, i) => q.file

    btn.disabled = false;
    if (r.error) return Forms.msg(m.querySelector("#aj-msg"), "err", r.error);
    Forms.msg(m.querySelector("#aj-msg"), "ok", r.status === "manual" ? `Added ${r.title} at ${r.company} to Apply yourself: ${r.reason.replace(/^Apply yourself: /, "")}.` : `Added ${r.title} at ${r.company}. The app applies to it next.`);
    input.value = "";
    refresh();
  };
  m.querySelector("#aj-go").onclick = go;
  input.onkeydown = (e) => { if (e.key === "Enter") go(); };
}

// ---------- dry run review, going live, updates ----------
function updateBanner() {
  const u = st.update;
  if (!u || !u.info || !["available", "downloading", "waiting", "installing", "error"].includes(u.phase)) return "";
  if (u.phase === "error" && !u.info.newer) return "";
  const v = esc(u.info.latest);
  const page = `<button class="btn sm" data-open-url="${esc(u.info.url)}">${icon("ext")}What's new</button>`;
  let body, actions = "";
  if (u.phase === "available") {
    body = `<b>Version ${v} is available</b>You have ${esc(u.info.current)}. Updating keeps all your data and settings, and the app restarts by itself.`;
    actions = u.packaged ? `${page}<button class="btn sm primary" onclick="installUpdate()">${icon("upload")}Update now</button>` : page;
  } else if (u.phase === "downloading") {
    body = `<b>Downloading version ${v}: ${Math.round((u.progress || 0) * 100)}%</b><div class="bar" style="margin-top:8px"><i style="width:${Math.round((u.progress || 0) * 100)}%"></i></div>`;
  } else if (u.phase === "waiting") {
    body = `<b>Version ${v} is ready</b>The application in progress finishes first, then the app restarts with the new version.`;
  } else if (u.phase === "installing") {
    body = `<b>Installing version ${v}</b>The app closes and opens again in a moment.`;
  } else {
    body = `<b>The update did not install</b>${esc(u.error || "")}`;
    actions = `<button class="btn sm" data-open-url="${esc(u.info.url)}">${icon("ext")}Download it instead</button>${u.packaged ? `<button class="btn sm primary" onclick="installUpdate()">Try again</button>` : ""}`;
  }
  return `<div class="banner ${u.phase === "error" ? "amber" : "blue"}">${icon("upload")}<div style="flex:1">${body}</div>${actions ? `<div class="right">${actions}</div>` : ""}</div>`;
}
async function installUpdate() {
  const r = await api("/api/update/install", {});
  if (r.error) toast(r.error);
  refreshStatusOnly(true);
}
async function checkUpdate(el) {
  if (el) el.disabled = true;
  const u = await api("/api/update/check", {});
  if (el) el.disabled = false;
  toast(u.error || (u.phase === "available" ? `Version ${u.info.latest} is available: press Update now` : u.phase === "uptodate" ? `You have the latest version (${u.info.current})` : u.error || "Could not check for updates"));
  refreshStatusOnly(true);
}
function banners() {
  if (!st) return "";
  const s = st.settings;
  let h = updateBanner();
  const waiting = st.toAnswer || { count: 0 };
  if (waiting.count && waiting.first) h += `<div class="banner amber">${icon("alert")}<div><b>${waiting.count} application${waiting.count === 1 ? " is" : "s are"} waiting for your answer</b>The app stopped on questions only you can answer. Answer them and it carries on with your answers.</div>
    <div class="right"><button class="btn sm primary" data-open-job="${esc(waiting.first.slug)}">Answer now</button></div></div>`;
  // A search that found nothing because a site would not open, said plainly instead of "queue empty".
  const sr = st.search;
  if (sr && sr.aiProblem && view === "overview") {
    h += `<div class="banner red">${icon("alert")}<div><b>The AI couldn't check the jobs the last search found</b>${esc(sr.aiProblem)} Those jobs are checked again on the next search.</div>
      <div class="right"><button class="btn sm" onclick="go('settings')">Open Settings</button><button class="btn sm" onclick="searchNow()">Search now</button></div></div>`;
  }
  else if (sr && sr.problems && sr.problems.length && view === "overview") {
    const all = sr.found === 0;
    h += `<div class="banner ${all ? "red" : "amber"}">${icon("alert")}<div><b>${all ? "The last search found nothing: " : ""}${sr.problems.map((x) => esc(x.source)).join(" and ")} could not be searched</b>${esc(sr.problems[0].message)}.
      ${all && (sr.sources || []).length < 2 ? " It's the only place the app looks right now: turn on another in Settings > Jobs to look for, or press Search now to try again." : " The app tries again on the next search."}</div>
      <div class="right"><button class="btn sm" onclick="searchNow()">Search now</button></div></div>`;
  }
  else if (sr && sr.at && sr.done && !sr.queued && !sr.toYou && !(sr.skipped && sr.skipped.total) && view === "overview" && !(st.counts || {}).queued && !(st.counts || {}).working && !(st.counts || {}).filled && !st.state.job && st.state.now !== "searching") {
    h += `<div class="banner amber">${icon("search")}<div><b>The last search found nothing to apply to${sr.nextAt ? `. Next search around ${new Date(sr.nextAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : ""}</b>Job sites had nothing new for these titles near you. Shorter, more common job titles, a wider distance, or older postings (Settings > Jobs to look for > More options) find more.</div>
      <div class="right"><button class="btn sm" onclick="go('settings')">Change what to look for</button></div></div>`;
  }
  // Searched, nothing to apply to: when the next search is, and why the jobs it found were left out.
  else if (sr && sr.done && sr.skipped && sr.skipped.total && view === "overview" && !(st.counts || {}).queued && !(st.counts || {}).working && !st.state.job && st.state.now !== "searching" && !(st.counts || {}).filled && !(st.counts || {}).applied) {
    const next = sr.nextAt ? new Date(sr.nextAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    const why = sr.skipped.top.map((x) => `${x.count} ${esc(x.why)}`).join(", ");
    h += `<div class="banner amber">${icon("search")}<div><b>Nothing to apply to right now${next ? `. Next search around ${next}` : ""}</b>${sr.skipped.total} job${sr.skipped.total === 1 ? " was" : "s were"} found and left out${why ? `: ${why}` : ""}. More job titles, a wider distance, or "Suggest jobs from my resume" (Settings > Jobs to look for) find more.</div>
      <div class="right"><button class="btn sm" onclick="go('skipped')">See why</button><button class="btn sm" onclick="searchNow()">Search now</button></div></div>`;
  }
  const mine = (st.counts || {}).manual || 0;
  if (mine && view === "overview") h += `<div class="banner amber">${icon("ext")}<div><b>${mine} good match${mine === 1 ? "" : "es"} for you to apply to</b>These sites need an account or use a chat bot, so the app can't apply for you. Each takes a few minutes.</div>
    <div class="right"><button class="btn sm" onclick="go('manual')">Show them</button></div></div>`;
  if (s.dryRun && !s.reviewedDryRun) {
    h += st.firstFilled
      ? `<div class="banner violet">${icon("eye")}<div><b>Your first application is filled in, not sent</b>Check every answer, the resume and the screenshot for ${esc(String(st.firstFilled.company).replace(/\.$/, ""))}. The autopilot waits until you do.</div>
          <div class="right"><button class="btn sm primary" data-open-job="${esc(st.firstFilled.slug)}">Review it</button></div></div>`
      : `<div class="banner violet">${icon("eye")}<div><b>Dry run</b>The first good match will be filled in but not submitted, so you can check it before anything goes out.</div></div>`;
  } else if (s.dryRun) {
    h += `<div class="banner amber">${icon("alert")}<div><b>Dry run is on</b>Forms are filled and checked but never submitted. Turn on Go live in the sidebar to start applying.</div>
      <div class="right"><button class="btn sm primary" onclick="goLive()">Go live</button></div></div>`;
  }
  return h;
}
// A dialog: announced as one, named by its heading, the page behind locked while it's open,
// Escape closes it, and the focus goes back to where it was.
function modal(html) {
  const back = document.activeElement;
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const box = bg.firstElementChild, h = box.querySelector("h2, h3");
  if (h) { h.id = h.id || "modal-title"; box.setAttribute("aria-labelledby", h.id); }
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); bg.remove(); } };
  const remove = bg.remove.bind(bg);
  bg.remove = () => {
    remove();
    document.removeEventListener("keydown", onKey, true);
    document.querySelector(".app").inert = $("drawer").classList.contains("open");
    if (back && back.isConnected) focusSoon(() => back);
  };
  document.addEventListener("keydown", onKey, true);
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.append(bg);
  document.querySelector(".app").inert = true;
  focusSoon(() => box.contains(document.activeElement) ? document.activeElement : box.querySelector("input, select, textarea, button"));
  return bg;
}
function goLive() {
  const s = st.settings;
  if (!s.reviewedDryRun) {
    const m = modal(`<h2>Check a filled application first</h2><p class="muted">Going live is unlocked once you have opened a filled (dry run) application and pressed "I checked these answers".</p>
      <div class="row-actions" style="margin-top:16px">${st.firstFilled ? `<button class="btn primary" id="m-open">Review it now</button>` : ""}<button class="btn" id="m-close">Close</button></div>`);
    m.querySelector("#m-close").onclick = () => m.remove();
    const o = m.querySelector("#m-open"); if (o) o.onclick = () => { m.remove(); openJob(st.firstFilled.slug); };
    return;
  }
  const m = modal(`<h2>Start submitting applications?</h2><p>From now on the app <b>submits</b> applications in your name: up to <b>${s.dailyCap} a day</b>, ${s.minutesBetweenApplies} minutes apart, only when every required answer is filled from your facts.</p>
    <p class="muted">You can pause, or switch back to dry run, at any time.</p>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="m-ok">I have checked a filled application and I am ready.</label>
    <div class="row-actions" style="margin-top:18px"><button class="btn primary" id="m-go" disabled>Go live</button><button class="btn" id="m-close">Cancel</button></div>`);
  m.querySelector("#m-ok").onchange = (e) => { m.querySelector("#m-go").disabled = !e.target.checked; };
  m.querySelector("#m-close").onclick = () => m.remove();
  m.querySelector("#m-go").onclick = async () => {
    const r = await api("/api/golive", { confirm: true });
    m.remove();
    toast(r.error || "Live: applications will be submitted");
    refresh();
  };
}

// ---------- profile and settings ----------
let cfg = null;
async function renderConfig() {
  cfg = await api("/api/config");
  // Each section folds away; the ones people change most start open.
  const card = (id, title, sub, open, adv) => `<details class="card card-fold ${adv ? "adv" : ""}" ${open ? "open" : ""}><summary><div class="card-h"><h2>${title}</h2><span class="sub">${sub || ""}</span></div></summary>
    <div class="sec" id="sec-${id}"></div><div class="save-bar"><button class="btn primary" data-save="${id}">${icon("check")}Save changes</button><div id="msg-${id}" style="flex:1"></div></div></details>`;
  if (view === "profile") {
    const fold = (id, title, sub, open) => `<details class="card card-fold" ${open ? "open" : ""}><summary><div class="card-h"><h2>${title}</h2><span class="sub">${sub}</span></div></summary><div class="sec" id="sec-${id}"></div></details>`;
    $("main").innerHTML = header() + `<div id="cfg-host">
      ${cfg.profile ? fold("studio", "Check &amp; improve", "What a recruiter will notice, and better wording for your lines", true) : ""}
      ${fold("create", "Make a resume with me", "Answer a few questions; the app writes the lines, you approve them", !cfg.profile)}
      ${card("review", "All your resume pieces", "Edit, approve or delete each line; only approved ones are ever used")}
      <div class="adv">${fold("github", "Projects from GitHub", "Pick your public projects; the app writes lines about them for you to approve")}</div>
      ${fold("upload", "Add another resume", "Upload a PDF or Word file; its pieces are added unapproved")}</div>`;
    const forms = { review: Forms.review($("sec-review"), cfg) };
    const studio = cfg.profile ? Forms.studio($("sec-studio"), cfg, () => { forms.review = Forms.review($("sec-review"), cfg); }) : null;
    const added = () => { forms.review = Forms.review($("sec-review"), cfg); const d = $("sec-review").closest("details"); d.open = true; d.scrollIntoView({ behavior: "smooth" }); if (studio) studio.refresh(); toast("Added. Check and approve the new lines below."); };
    Forms.creator($("sec-create"), cfg, added);
    Forms.resumes($("sec-upload"), cfg, added, { withGithub: false });
    Forms.github($("sec-github"), cfg, added);
    bindSaves(forms);
  } else {
    $("main").innerHTML = header() + `<div id="cfg-host">
      <div class="card" style="margin-bottom:12px"><div class="card-h"><h2>Updates</h2></div><div class="sec" id="update-card">${updateCard()}</div></div>
      <div class="card" style="margin-bottom:12px"><div class="card-h"><h2>Appearance</h2><span class="sub">Light or dark, text size, and how much to show</span></div><div class="sec" id="sec-theme">
        <div class="radio-row" role="radiogroup" aria-label="Appearance">${[["system", "Match my computer"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) =>
          `<label><input type="radio" name="theme" value="${v}" ${(cfg.settings.theme || "system") === v ? "checked" : ""}>${l}</label>`).join("")}</div>
        <div class="fld" style="margin-top:12px"><span>Text size</span><div class="radio-row" role="radiogroup" aria-label="Text size">${[[1, "Normal"], [1.15, "Larger"], [1.3, "Largest"]].map(([v, l]) =>
          `<label><input type="radio" name="textSize" value="${v}" ${Number(cfg.settings.textSize || 1) === v ? "checked" : ""}>${l}</label>`).join("")}</div>
          <small>Makes everything in the window bigger. Ctrl and + or - (Cmd on a Mac) zooms too.</small></div>
        <div class="fld" style="margin-top:12px"><span>How much to show</span><div class="radio-row" role="radiogroup" aria-label="How much to show">${[["simple", "Simple: just what you need"], ["advanced", "Advanced: every option and statistic"]].map(([v, l]) =>
          `<label><input type="radio" name="uiMode" value="${v}" ${(cfg.settings.uiMode || "simple") === v ? "checked" : ""}>${l}</label>`).join("")}</div></div></div></div>
      ${card("prefs", "Jobs to look for", "Job titles, where, and which sites to search", true)}
      ${card("questions", "About you", "The answers application forms ask for")}
      ${card("ai", "AI", "The AI service the app uses")}
      ${card("mailbox", "Mailbox", "Optional: email codes and spotting jobs you already applied to")}
      ${card("accounts", "Job site accounts", "Optional: let the app make accounts on Workday sites and apply there too", false, true)}
      ${card("running", "Pace and browser", "How many a day, and the browser window", false, true)}
      <div class="card adv" style="margin-bottom:12px"><div class="card-h"><h2>Application history</h2><span class="sub">So you never apply twice, even after a reinstall</span></div><div class="sec" id="sec-history"></div></div>
      <div class="card" style="margin-bottom:12px"><div class="card-h"><h2>Your answers to form questions</h2><span class="sub">Questions you answered when an application stopped; the app uses them again</span></div><div class="sec" id="sec-yours"></div></div>
      <div class="card sec adv"><h2>Your data</h2><p>Everything lives in one folder on this computer: <span class="mono">${esc(cfg.dataDir)}</span>. Version ${esc(cfg.version)}.</p>
        <div class="row-actions"><button class="btn sm" onclick="window.ja.showDataFolder()">${icon("ext")}Open the folder</button>
        <button class="btn sm" onclick="window.ja.go('onboarding.html')">${icon("retry")}Run the setup again</button></div></div></div>`;
    const forms = { prefs: Forms.prefs($("sec-prefs"), cfg), questions: Forms.questions($("sec-questions"), cfg), ai: Forms.ai($("sec-ai"), cfg),
      mailbox: Forms.mailbox($("sec-mailbox"), cfg), running: Forms.running($("sec-running"), cfg), accounts: Forms.accounts($("sec-accounts")) };
    Forms.history($("sec-history"), cfg, () => refreshStatusOnly());
    drawYours();
    document.querySelectorAll("#sec-theme [name=uiMode]").forEach((r) => r.onchange = () => setMode(r.value));
    document.querySelectorAll("#sec-theme [name=textSize]").forEach((r) => r.onchange = async () => {
      cfg.settings.textSize = window.ja.setTextSize ? await window.ja.setTextSize(Number(r.value)) : Number(r.value);
    });
    document.querySelectorAll("#sec-theme [name=theme]").forEach((r) => r.onchange = async () => {
      cfg.settings.theme = window.ja.setTheme ? await window.ja.setTheme(r.value) : r.value;
    });
    bindSaves(forms);
  }
}
async function drawYours() {
  const host = $("sec-yours"); if (!host) return;
  const list = await api("/api/your-answers");
  host.innerHTML = list.length ? `<div class="sub-list">${list.map((x, i) => `<div class="sub-item yours"><div><b>${esc(x.label)}</b><div>${esc(x.value)}</div>
      <small class="muted">${x.scope === "all" ? "Used for every application that asks this" : `Only for ${esc(x.company || "one job")}`}</small></div>
      <button class="btn ghost sm" data-i="${i}">${icon("trash")}Remove</button></div>`).join("")}</div>`
    : `<p class="muted" style="margin:0">None yet. When an application stops on a question only you can answer, you answer it in the job's panel and it shows up here.</p>`;
  host.querySelectorAll("[data-i]").forEach((b) => b.onclick = async () => { const x = list[Number(b.dataset.i)]; await api("/api/your-answers/remove", { key: x.key, scope: x.scope }); drawYours(); });
}
function bindSaves(forms) {
  document.querySelectorAll("[data-save]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.save;
    b.disabled = true;
    const e = await forms[id].save();
    b.disabled = false;
    Forms.msg($("msg-" + id), e ? "err" : "ok", e || "Saved.");
    if (!e) refreshStatusOnly();
  });
}
