appId: io.github.antonyperez0.jobautopilot
productName: Job Autopilot
copyright: Copyright © 2026 AntonyPerez0
directories:
  output: dist
  buildResources: build
files:
  - main/**
  - core/**
  - ui/**
  - vendor/**
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  # optional native canvas for pdf.js; never needed, and native code does not belong here
  - "!node_modules/@napi-rs/**"
# Playwright's installer runs as a separate process (Chromium download), so it must live outside the asar archive.
asarUnpack:
  - node_modules/playwright-core/**
publish: null

# Electron's own switches, written into the app's binary at build time: no NODE_OPTIONS, the app only from its
# own asar archive (checked against its hash on macOS and Windows), and no extra powers for file:// pages.
electronFuses:
  enableNodeOptionsEnvironmentVariable: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# The Electron runtime the app is built on must be exactly the one Electron published (SHASUMS256.txt of the
# v45.0.0 release). A new Electron version needs its own sums here, or the build stops.
electronDownload:
  checksums:
    electron-v45.0.0-darwin-arm64.zip: 896c3a50b148e89a158dca08a6996a022ddf39b23aac871e107f5b4087f8caa9
    electron-v45.0.0-darwin-x64.zip: 7877c282e74a52f8d87949536a25735cf9982de1265b544c9cd258dd14eff4de
    electron-v45.0.0-win32-x64.zip: ae53887a23bb640369c93dbd38c408a2af5c0deb86f2fa76c6c244cb444b7f47
    electron-v45.0.0-linux-x64.zip: 22f6a10bd3f7fef987ddbb379d3375ce664ad0c98a9a50f80c89f1718a0c3e3a
    electron-v45.0.0-linux-arm64.zip: a80d92b1ad6c111545a12632b8a75cedce614a41866e500810d4050d947f90e9

mac:
  target:
    - target: dmg
      arch: [universal]
    # the zipped app is what "Update now" downloads
    - target: zip
      arch: [universal]
  category: public.app-category.productivity
  # Ad-hoc signature: unsigned builds otherwise show as "damaged" on Apple Silicon.
  # For a Developer ID signature and notarization see docs/SIGNING.md.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Job-Autopilot-${version}-mac-universal.${ext}
dmg:
  title: Job Autopilot ${version}
  writeUpdateInfo: false

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Job-Autopilot-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  # The per-user folder (AppData\Local\Programs) only: a folder picked by hand could let other accounts change the app.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Job Autopilot
  differentialPackage: false
