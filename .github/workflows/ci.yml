name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium for the form-fill tests
        run: npx playwright-core install --with-deps chromium
      # Newer Ubuntu runners stop unprivileged user namespaces (AppArmor), so Chromium has no sandbox and aborts
      # ("No usable sandbox!"). The runner allows them again; the browser keeps its sandbox.
      - name: Let Chromium use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Unit and fill tests
        run: npm test
      - name: First-run setup, end to end (from source)
        run: xvfb-run -a npm run e2e
      - name: Accessibility (WCAG 2.2 AA with axe-core, colour contrast, keyboard)
        run: xvfb-run -a npm run a11y
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots-linux
          path: |
            test/out/e2e/*
            test/out/a11y/*
