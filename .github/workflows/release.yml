name: Build installers
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Installers are only built from reviewed code: a release tag must point to a commit on main.
      - name: The tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: The application browser stays minimized while it fills a form
        run: node test/e2e/minimized.mjs

      - name: Build the macOS .dmg (universal)
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win

      # Install the built app the way a user would, launch it, and walk the whole first-run setup.
      - name: Install from the .dmg and run the setup end to end
        if: runner.os == 'macOS'
        timeout-minutes: 25
        run: |
          # The app reads its safeStorage key from the keychain at startup, and macOS asks before a copy with another
          # ad-hoc signature reads a key the first copy stored (nobody answers here, and the app waits). Each
          # differently signed copy below gets a fresh keychain of its own, so it is always the first.
          newkc() { kc="$RUNNER_TEMP/$1.keychain-db"; security create-keychain -p ci "$kc"; security set-keychain-settings "$kc"; security unlock-keychain -p ci "$kc"; security list-keychains -d user -s "$kc"; security default-keychain -d user -s "$kc"; }
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/ja-dmg
          cp -R "/tmp/ja-dmg/Job Autopilot.app" "$RUNNER_TEMP/"
          hdiutil detach /tmp/ja-dmg
          codesign -dv "$RUNNER_TEMP/Job Autopilot.app" 2>&1 | head -5
          lipo -archs "$RUNNER_TEMP/Job Autopilot.app/Contents/MacOS/Job Autopilot"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Job Autopilot.app"
          # The app as shipped starts by itself: it records its launch (a copy of its own, in a keychain of its own).
          newkc shipped
          mkdir -p "$RUNNER_TEMP/as-shipped/data"
          cp -R "$RUNNER_TEMP/Job Autopilot.app" "$RUNNER_TEMP/as-shipped/"
          JA_DATA_DIR="$RUNNER_TEMP/as-shipped/data" "$RUNNER_TEMP/as-shipped/Job Autopilot.app/Contents/MacOS/Job Autopilot" > "$RUNNER_TEMP/as-shipped.log" 2>&1 &
          SHIPPED=$!
          for i in $(seq 1 90); do [ -f "$RUNNER_TEMP/as-shipped/data/launches.json" ] && break; sleep 1; done
          kill $SHIPPED 2>/dev/null || true; sleep 3; kill -9 $SHIPPED 2>/dev/null || true
          pkill -9 -f "as-shipped/Job Autopilot.app" || true
          tail -20 "$RUNNER_TEMP/as-shipped.log"
          test -f "$RUNNER_TEMP/as-shipped/data/launches.json" || { echo "::error::the app as shipped did not start"; exit 1; }
          rm -rf "$RUNNER_TEMP/as-shipped/Job Autopilot.app"
          # The shipped app ignores --inspect (a fuse), and the tests drive it through Playwright, which needs it:
          # this installed test copy only gets it back (and a fresh ad-hoc signature). The .dmg stays as built.
          npx --no-install electron-fuses read --app "$RUNNER_TEMP/Job Autopilot.app" | grep -q "EnableNodeCliInspectArguments is Disabled"
          npx --no-install electron-fuses write --app "$RUNNER_TEMP/Job Autopilot.app" EnableNodeCliInspectArguments=on
          codesign --sign - --force --deep --preserve-metadata=entitlements,requirements,flags,runtime "$RUNNER_TEMP/Job Autopilot.app"
          newkc test
          JA_E2E_CHROMIUM=1 JA_APP_EXE="$RUNNER_TEMP/Job Autopilot.app/Contents/MacOS/Job Autopilot" node test/e2e/onboarding.mjs
      - name: Update now, end to end (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          # The update offered is the test copy zipped (the same signature, so the same keychain key): the download,
          # its checksum, the swap and the restart are what's tested. The shipped zip's app was started above.
          ditto -c -k --keepParent "$RUNNER_TEMP/Job Autopilot.app" "$RUNNER_TEMP/Job-Autopilot-99.0.0-mac-universal.zip"
          JA_APP_EXE="$RUNNER_TEMP/Job Autopilot.app/Contents/MacOS/Job Autopilot" JA_UPDATE_FILE="$RUNNER_TEMP/Job-Autopilot-99.0.0-mac-universal.zip" node test/e2e/update.mjs
      - name: What happened to the app (macOS, after a failure)
        if: failure() && runner.os == 'macOS'
        run: |
          ls -la "$RUNNER_TEMP" | head -20
          ls -la "$RUNNER_TEMP/Job Autopilot.app/Contents/MacOS" 2>&1 | head
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Job Autopilot.app" 2>&1 | tail -5 || true
          security find-generic-password -s "Job Autopilot Safe Storage" 2>&1 | grep -E '"acct"|"svce"' || true
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          f=$(ls -t ~/Library/Logs/DiagnosticReports/*Job* 2>/dev/null | head -1); [ -n "$f" ] && head -60 "$f"
          log show --last 10m --style compact --predicate 'process == "Job Autopilot" OR eventMessage CONTAINS "Job Autopilot"' 2>/dev/null | tail -60 || true
      - name: Install with the .exe installer and run the setup end to end
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          $app = Join-Path $env:LOCALAPPDATA "Programs\Job Autopilot\Job Autopilot.exe"
          if (!(Test-Path $app)) { Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA "Programs") -Filter "Job Autopilot.exe" | Select-Object -First 3; throw "installed app not found" }
          # The shipped app ignores --inspect (a fuse), and the tests drive it through Playwright, which needs it:
          # this runner's installed copy only gets it back. The Setup .exe stays as built.
          # The app as shipped starts by itself (nothing below changes it yet): it records its launch.
          $shipped = Join-Path $env:RUNNER_TEMP "as-shipped"
          New-Item -ItemType Directory -Force $shipped | Out-Null
          $env:JA_DATA_DIR = $shipped
          $p = Start-Process -FilePath $app -PassThru
          for ($i = 0; $i -lt 90 -and !(Test-Path (Join-Path $shipped "launches.json")); $i++) { Start-Sleep 1 }
          Get-Process "Job Autopilot" -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 3
          Remove-Item Env:JA_DATA_DIR
          if (!(Test-Path (Join-Path $shipped "launches.json"))) { throw "the app as shipped did not start" }
          $fuses = npx --no-install electron-fuses read --app $app | Out-String
          if ($fuses -notmatch "EnableNodeCliInspectArguments is Disabled") { throw "the built app should ignore --inspect" }
          npx --no-install electron-fuses write --app $app EnableNodeCliInspectArguments=on
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:JA_APP_EXE = $app
          $env:JA_E2E_CHROMIUM = "1"
          node test/e2e/onboarding.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Update now, end to end (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JA_APP_EXE = Join-Path $env:LOCALAPPDATA "Programs\Job Autopilot\Job Autopilot.exe"
          $env:JA_UPDATE_FILE = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          node test/e2e/update.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*-mac-universal.zip
            dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots-${{ runner.os }}
          path: test/out/e2e/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: out
      - name: Attach installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Update now" in the app checks every download against these.
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Job Autopilot $GITHUB_REF_NAME" \
              --notes "Download the .dmg for macOS (Apple Silicon and Intel) or the Setup .exe for Windows. These builds are not signed yet: see the README for the one-time Open Anyway / Run anyway step." \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          gh release upload "$GITHUB_REF_NAME" out/* -R "$GITHUB_REPOSITORY" --clobber
